name: EANUXX APK Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build EANUXX update APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # FIND SOURCE ZIP
      # ============================================================

      - name: Locate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No source ZIP found in repository root."
            exit 1
          fi

          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

          echo "Using source package:"
          echo "$ZIP"


      # ============================================================
      # EXTRACT SOURCE
      # ============================================================

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          unzip -q "$SOURCE_ZIP" -d source

          test -f source/EANUXX/settings.gradle.kts
          test -f source/EANUXX/build.gradle.kts
          test -f source/EANUXX/app/build.gradle.kts

          echo "Source project found and validated."


      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # GRADLE
      # ============================================================

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ============================================================
      # CHECK PROJECT
      # ============================================================

      - name: Check Gradle project
        working-directory: source/EANUXX
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          gradle --no-daemon tasks --all

          echo "Gradle project check passed."


      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build release APK
        working-directory: source/EANUXX
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon clean assembleRelease

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -f "$APK"
          test -s "$APK"

          echo "Unsigned APK created:"
          ls -lh "$APK"


      # ============================================================
      # ZIPALIGN
      # ============================================================

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail

          INPUT="source/EANUXX/app/build/outputs/apk/release/app-release-unsigned.apk"

          OUTPUT="source/EANUXX/app/build/outputs/apk/release/EANUXX-aligned.apk"

          ZIPALIGN="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name zipalign \
              | sort -V \
              | tail -1
          )"

          test -n "$ZIPALIGN"
          test -x "$ZIPALIGN"

          echo "Using:"
          echo "$ZIPALIGN"

          "$ZIPALIGN" -f -p 4 "$INPUT" "$OUTPUT"

          "$ZIPALIGN" -c -P 4 -v 4 "$OUTPUT"

          test -s "$OUTPUT"

          echo "APK alignment successful."


      # ============================================================
      # VERIFY RESOURCES
      # ============================================================

      - name: Verify resources.arsc
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import zipfile

          apk = "source/EANUXX/app/build/outputs/apk/release/EANUXX-aligned.apk"

          with zipfile.ZipFile(apk, "r") as z:
              info = z.getinfo("resources.arsc")

              if info.compress_type != zipfile.ZIP_STORED:
                  raise SystemExit(
                      "ERROR: resources.arsc is compressed."
                  )

          print("resources.arsc is uncompressed.")
          print("zipalign already verified APK alignment.")
          PY


      # ============================================================
      # RESTORE CERTIFICATE
      # ============================================================

      - name: Restore signing certificate
        env:
          KEYSTORE_B64: ${{ secrets.EANUXX_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "ERROR: EANUXX_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > EANUXX-release.p12

          chmod 600 EANUXX-release.p12

          test -s EANUXX-release.p12

          echo "Signing certificate restored."


      # ============================================================
      # VERIFY CERTIFICATE
      # ============================================================

      - name: Verify signing certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: EANUXX_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          EXPECTED="95:3F:44:4B:65:59:4F:10:FC:C4:56:A7:F5:44:3F:DB:95:54:AF:46:F9:A5:FB:72:BF:24:92:91:C8:48:C7:E0"

          FINGERPRINT="$(
            keytool -list -v \
              -storetype PKCS12 \
              -keystore EANUXX-release.p12 \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias eanuxx \
            | awk -F': ' '/SHA256:/{print $2; exit}'
          )"

          echo "Certificate fingerprint:"
          echo "$FINGERPRINT"

          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "ERROR: Certificate does not match installed EANUXX certificate."
            exit 1
          fi

          echo "Correct EANUXX certificate confirmed."


      # ============================================================
      # SIGN APK
      # ============================================================

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              | sort -V \
              | tail -1
          )"

          test -n "$APKSIGNER"
          test -x "$APKSIGNER"

          INPUT="source/EANUXX/app/build/outputs/apk/release/EANUXX-aligned.apk"

          OUTPUT="source/EANUXX/app/build/outputs/apk/release/EANUXX-Livestreaming-Studio-v0.3.0-update.apk"

          "$APKSIGNER" sign \
            --ks EANUXX-release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias eanuxx \
            --ks-pass env:KEYSTORE_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUTPUT" \
            "$INPUT"

          test -s "$OUTPUT"

          echo "Signed APK created:"
          ls -lh "$OUTPUT"


      # ============================================================
      # VERIFY FINAL APK
      # ============================================================

      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail

          APK="source/EANUXX/app/build/outputs/apk/release/EANUXX-Livestreaming-Studio-v0.3.0-update.apk"

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              | sort -V \
              | tail -1
          )"

          AAPT="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name aapt \
              | sort -V \
              | tail -1
          )"

          test -n "$APKSIGNER"
          test -n "$AAPT"
          test -s "$APK"

          echo "========================================"
          echo "VERIFYING APK SIGNATURE"
          echo "========================================"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo "========================================"
          echo "VERIFYING PACKAGE"
          echo "========================================"

          BADGING="$("$AAPT" dump badging "$APK")"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -F "package: name='com.wEANUXX_20148007'"

          echo "Package name confirmed."

          echo "========================================"
          echo "VERIFYING VERSION"
          echo "========================================"

          echo "$BADGING" \
            | grep -F "versionCode='3'"

          echo "$BADGING" \
            | grep -F "versionName='0.3.0-functional-update'"

          echo "Version confirmed."

          echo "========================================"
          echo "VERIFYING CERTIFICATE"
          echo "========================================"

          EXPECTED="95:3F:44:4B:65:59:4F:10:FC:C4:56:A7:F5:44:3F:DB:95:54:AF:46:F9:A5:FB:72:BF:24:92:91:C8:48:C7:E0"

          CERT_OUTPUT="$(
            "$APKSIGNER" verify \
              --print-certs \
              "$APK" 2>&1
          )"

          echo "$CERT_OUTPUT"

          NORMALIZED_CERT="$(
            echo "$CERT_OUTPUT" \
              | tr '[:lower:]' '[:upper:]'
          )"

          NORMALIZED_EXPECTED="$(
            echo "$EXPECTED" \
              | tr '[:lower:]' '[:upper:]'
          )"

          echo "$NORMALIZED_CERT" \
            | grep -F "$NORMALIZED_EXPECTED"

          echo "Correct certificate confirmed."

          echo "========================================"
          echo "VERIFYING APK ZIP"
          echo "========================================"

          python3 - <<'PY'
          import zipfile

          apk = "source/EANUXX/app/build/outputs/apk/release/EANUXX-Livestreaming-Studio-v0.3.0-update.apk"

          with zipfile.ZipFile(apk, "r") as z:
              bad = z.testzip()

              if bad:
                  raise SystemExit(
                      f"ERROR: Corrupt APK entry: {bad}"
                  )

          print("APK ZIP integrity verified.")
          PY

          echo "========================================"
          echo "EANUXX UPDATE APK VERIFIED SUCCESSFULLY"
          echo "========================================"


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EANUXX-Livestreaming-Studio-v0.3.0-update
          path: source/EANUXX/app/build/outputs/apk/release/EANUXX-Livestreaming-Studio-v0.3.0-update.apk
          if-no-files-found: error
          retention-days: 14


      # ============================================================
      # CLEAN SIGNING MATERIAL
      # ============================================================

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          rm -f EANUXX-release.p12

          echo "Signing material removed."
