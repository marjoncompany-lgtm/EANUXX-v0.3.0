name: EANUXX v0.6.0 Android 17 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-apk.yml"
      - "*.zip"

permissions:
  contents: read

concurrency:
  group: eanuxx-v0.6.0-build
  cancel-in-progress: true

env:
  PACKAGE_NAME: com.wEANUXX_20148007
  VERSION_CODE: "9"
  VERSION_NAME: 0.6.0-professional-ui
  EXPECTED_CERT_SHA256: 953F444B65594F10FCC456A7F5443FDB9554AF46F9A5FB72BF249291C848C7E0
  EXPECTED_SOURCE_SHA256: 57916267030482bf6fcc20d16505add3c464242c96b08fb66742de46e300439b
  ANDROID_PLATFORM: android-37.0
  ANDROID_BUILD_TOOLS: 36.0.0
  GRADLE_VERSION: 9.6.1

jobs:
  build:
    name: Build EANUXX v0.6.0 APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Locate exactly one source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t zips < <(find . -maxdepth 1 -type f -name '*.zip' -print0 | sort -z)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one root source ZIP; found ${#zips[@]}."
            printf '%s\n' "${zips[@]}" | sed 's#^\./##'
            exit 1
          fi
          SOURCE_ZIP="${zips[0]#./}"
          printf 'SOURCE_ZIP=%s\n' "$SOURCE_ZIP" >> "$GITHUB_ENV"
          echo "Found source ZIP: $SOURCE_ZIP"
          test -f "$SOURCE_ZIP"

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP"
          actual="$(sha256sum "$SOURCE_ZIP" | awk '{print $1}')"
          echo "Source SHA-256: $actual"
          echo "Expected SHA-256: $EXPECTED_SOURCE_SHA256"
          [ "$actual" = "$EXPECTED_SOURCE_SHA256" ]

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app-source
          mkdir -p app-source
          unzip -q "$SOURCE_ZIP" -d app-source

          if [ -f app-source/settings.gradle.kts ]; then
            PROJECT_DIR="app-source"
          elif [ -f app-source/app-source/settings.gradle.kts ]; then
            PROJECT_DIR="app-source/app-source"
          else
            mapfile -t projects < <(find app-source -maxdepth 4 -type f -name settings.gradle.kts -print | sort)
            if [ "${#projects[@]}" -ne 1 ]; then
              echo "ERROR: expected exactly one Gradle settings file; found ${#projects[@]}."
              printf '%s\n' "${projects[@]}"
              exit 1
            fi
            PROJECT_DIR="$(dirname "${projects[0]}")"
          fi

          test -f "$PROJECT_DIR/settings.gradle.kts"
          printf 'PROJECT_DIR=%s\n' "$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.6.1

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version

      - name: Ensure Android 17 SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"

      - name: Validate Gradle project configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          grep -q 'compileSdk = 37' app/build.gradle.kts
          grep -q 'targetSdk = 37' app/build.gradle.kts
          grep -q 'versionCode = 9' app/build.gradle.kts
          grep -q 'versionName = "0.6.0-professional-ui"' app/build.gradle.kts
          grep -q 'requireLensFacing' app/src/main/java/com/eanuxx/livestream/ui/screens/StudioScreen.kt
          echo "Gradle, Android 17, version, and CameraX source checks passed."

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace --warning-mode all

      - name: Select release APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t apks < <(find "$PROJECT_DIR/app/build/outputs/apk/release" -type f -name '*.apk' -print0 | sort -z)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one release APK; found ${#apks[@]}."
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          UNSIGNED_APK="${apks[0]}"
          printf 'UNSIGNED_APK=%s\n' "$UNSIGNED_APK" >> "$GITHUB_ENV"
          echo "Release APK: $UNSIGNED_APK"

      - name: Verify unsigned APK metadata
        shell: bash
        run: |
          set -euo pipefail
          AAPT2="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt2"
          test -x "$AAPT2"
          "$AAPT2" dump badging "$UNSIGNED_APK" | grep -q "package: name='$PACKAGE_NAME'"
          "$AAPT2" dump badging "$UNSIGNED_APK" | grep -q "versionCode='$VERSION_CODE'"
          "$AAPT2" dump badging "$UNSIGNED_APK" | grep -q "versionName='$VERSION_NAME'"

      - name: Align APK for 16 KB page compatibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"
          ALIGNED_APK="$GITHUB_WORKSPACE/output/EANUXX-v0.6.0-aligned.apk"
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/zipalign" -f -P 16 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          printf 'ALIGNED_APK=%s\n' "$ALIGNED_APK" >> "$GITHUB_ENV"

      - name: Verify alignment
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$ALIGNED_APK"

      - name: Verify resources.arsc is uncompressed
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$ALIGNED_APK" <<'PY'
          import sys
          import zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              info = z.getinfo("resources.arsc")
              if info.compress_type != zipfile.ZIP_STORED:
                  raise SystemExit("ERROR: resources.arsc is compressed")
          print("resources.arsc is uncompressed.")
          PY

      - name: Restore signing certificate
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.EANUXX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: EANUXX_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > EANUXX-release.p12
          chmod 600 EANUXX-release.p12
          test -s EANUXX-release.p12

      - name: Verify signing certificate
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: EANUXX_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          CERT_DER="$RUNNER_TEMP/eanuxx-certificate.der"

          keytool -exportcert             -alias eanuxx             -storetype PKCS12             -keystore EANUXX-release.p12             -storepass "$KEYSTORE_PASSWORD"             -file "$CERT_DER"             -noprompt

          actual="$(sha256sum "$CERT_DER" | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')"

          echo "Keystore certificate SHA-256: $actual"
          echo "Expected certificate SHA-256: $EXPECTED_CERT_SHA256"

          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "ERROR: Signing certificate does not match the existing EANUXX release certificate."
            exit 1
          fi

          echo "Signing certificate verified successfully."

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          FINAL_APK="$GITHUB_WORKSPACE/output/EANUXX_Livestreaming_Studio_v0.6.0.apk"
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" sign             --ks EANUXX-release.p12             --ks-type PKCS12             --ks-key-alias eanuxx             --ks-pass "pass:$KEYSTORE_PASSWORD"             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --v4-signing-enabled false             --out "$FINAL_APK"             "$ALIGNED_APK"
          printf 'FINAL_APK=%s\n' "$FINAL_APK" >> "$GITHUB_ENV"

      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL_APK"

      - name: Verify final APK certificate
        shell: bash
        run: |
          set -euo pipefail

          CERT_OUTPUT="$RUNNER_TEMP/apksigner-cert.txt"

          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"             verify             --print-certs             "$FINAL_APK" > "$CERT_OUTPUT" 2>&1

          cat "$CERT_OUTPUT"

          cert="$( python3 - "$CERT_OUTPUT" <<'PY' import re import sys text = open( sys.argv[1], "r", encoding="utf-8", errors="replace" ).read() match = re.search( r"SHA-256\s+digest:\s*(.*?)(?:\s+Signer\s+#1\s+certificate\s+SHA-1|\s+SHA-1\s+digest:)", text, re.IGNORECASE | re.DOTALL ) if not match: raise SystemExit( "ERROR: SHA-256 certificate digest section not found." ) value = re.sub(r"[^0-9A-Fa-f]", "", match.group(1)) if len(value) != 64: raise SystemExit( f"ERROR: expected 64 SHA-256 hex characters, found {len(value)}." ) print(value.upper()) PY )"

          echo "APK certificate SHA-256: $cert"
          echo "Expected certificate SHA-256: $EXPECTED_CERT_SHA256"

          if [ "$cert" != "$EXPECTED_CERT_SHA256" ]; then
            echo "ERROR: final APK certificate does not match expected certificate."
            exit 1
          fi

          echo "Final APK certificate verified successfully."

      - name: Verify final APK integrity and metadata
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$FINAL_APK" >/dev/null
          AAPT2="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt2"
          "$AAPT2" dump badging "$FINAL_APK" | grep -q "package: name='$PACKAGE_NAME'"
          "$AAPT2" dump badging "$FINAL_APK" | grep -q "versionCode='$VERSION_CODE'"
          "$AAPT2" dump badging "$FINAL_APK" | grep -q "versionName='$VERSION_NAME'"
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$FINAL_APK"
          echo "Final APK integrity, metadata, signature, and 16 KB alignment verified."

      - name: Generate checksum
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "$FINAL_APK" | tee "$GITHUB_WORKSPACE/output/EANUXX_Livestreaming_Studio_v0.6.0.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EANUXX-v0.6.0-APK
          path: |
            output/EANUXX_Livestreaming_Studio_v0.6.0.apk
            output/EANUXX_Livestreaming_Studio_v0.6.0.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          rm -f EANUXX-release.p12 certificate.txt