name: EANUXX v0.6.0 Android 17 Build - Fixed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - '*.zip'

permissions:
  contents: read

concurrency:
  group: eanuxx-android17-build
  cancel-in-progress: true

env:
  PACKAGE_NAME: 'com.wEANUXX_20148007'
  VERSION_CODE: '9'
  VERSION_NAME: '0.6.0-professional-ui'
  EXPECTED_CERT_SHA256: '953F444B65594F10FCC456A7F5443FDB9554AF46F9A5FB72BF249291C848C7E0'
  EXPECTED_SOURCE_SHA256: '57916267030482bf6fcc20d16505add3c464242c96b08fb66742de46e300439b'
  ANDROID_PLATFORM: 'android-37.0'
  ANDROID_BUILD_TOOLS: '36.0.0'
  GRADLE_VERSION: '9.6.1'

jobs:
  build:
    name: Build EANUXX v0.6.0 APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Locate exactly one source ZIP
        shell: bash
        run: |
          set -euo pipefail
          zips=()
          while IFS= read -r -d '' file; do
            zips+=("$file")
          done < <(find . -maxdepth 1 -type f -name '*.zip' -print0 | sort -z)

          if [ "${#zips[@]}" -ne 1 ]; then
            echo 'ERROR: Exactly one source ZIP must exist in the repository root.'
            echo 'Found:'
            if [ "${#zips[@]}" -eq 0 ]; then
              echo ' NONE'
            else
              printf ' %s\n' "${zips[@]}"
            fi
            exit 1
          fi

          echo "SOURCE_ZIP=${zips[0]}" >> "$GITHUB_ENV"
          echo "Using source ZIP: ${zips[0]}"

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$SOURCE_ZIP" >/dev/null
          actual="$(sha256sum "$SOURCE_ZIP" | awk '{print $1}')"
          echo "Actual source SHA-256: $actual"
          echo "Expected source SHA-256: $EXPECTED_SOURCE_SHA256"
          [ "$actual" = "$EXPECTED_SOURCE_SHA256" ]

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/app-source"
          mkdir -p "$GITHUB_WORKSPACE/app-source"
          unzip -q "$SOURCE_ZIP" -d "$GITHUB_WORKSPACE/app-source"

          settings_file=""
          while IFS= read -r -d '' file; do
            settings_file="$file"
            break
          done < <(find "$GITHUB_WORKSPACE/app-source" -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print0)

          if [ -z "$settings_file" ]; then
            echo 'ERROR: settings.gradle(.kts) not found in source ZIP.'
            exit 1
          fi

          project_dir="$(dirname "$settings_file")"
          [ -d "$project_dir/app" ]
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Gradle project: $project_dir"

      - name: Validate source project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'com.android.application.*9.4.0' build.gradle.kts
          grep -q 'org.jetbrains.kotlin.plugin.compose.*2.3.21' build.gradle.kts
          if grep -Eq '^[[:space:]]*id\([^)]*org\.jetbrains\.kotlin\.android' build.gradle.kts app/build.gradle.kts; then
            echo 'ERROR: org.jetbrains.kotlin.android plugin must not be present with AGP 9 built-in Kotlin.'
            exit 1
          fi
          grep -q 'compileSdk = 37' app/build.gradle.kts
          grep -q 'targetSdk = 37' app/build.gradle.kts
          grep -q 'buildConfig = true' app/build.gradle.kts
          grep -q 'versionCode = 9' app/build.gradle.kts
          grep -q 'versionName = "0.6.0-professional-ui"' app/build.gradle.kts
          grep -q 'requireLensFacing(lensFacing)' app/src/main/java/com/eanuxx/livestream/ui/screens/StudioScreen.kt
          ! grep -q 'setLensFacing(lensFacing)' app/src/main/java/com/eanuxx/livestream/ui/screens/StudioScreen.kt
          grep -q 'PRODUCTION CONTROL' app/src/main/java/com/eanuxx/livestream/ui/screens/StudioScreen.kt
          grep -q 'QUICK LAUNCH' app/src/main/java/com/eanuxx/livestream/ui/screens/HomeScreen.kt
          test -f app/src/main/java/com/eanuxx/livestream/data/PlatformHandoff.kt
          grep -q 'YouTube' app/src/main/java/com/eanuxx/livestream/data/PlatformHandoff.kt
          grep -q 'Facebook' app/src/main/java/com/eanuxx/livestream/data/PlatformHandoff.kt
          grep -q 'Instagram' app/src/main/java/com/eanuxx/livestream/data/PlatformHandoff.kt
          grep -q 'TikTok' app/src/main/java/com/eanuxx/livestream/data/PlatformHandoff.kt
          grep -q 'Auto-Fill' app/src/main/java/com/eanuxx/livestream/ui/screens/SettingsScreen.kt
          echo 'Source validation passed.'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          [ -n "$sdkmanager" ]
          yes | "$sdkmanager" --licenses >/dev/null || true
          [ -d "$ANDROID_HOME/platforms/$ANDROID_PLATFORM" ] || "$sdkmanager" "platforms;$ANDROID_PLATFORM"
          [ -d "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS" ] || "$sdkmanager" "build-tools;$ANDROID_BUILD_TOOLS"
          [ -x "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/zipalign" ]
          [ -x "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" ]
          [ -x "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt" ]
          echo "BUILD_TOOLS_DIR=$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS" >> "$GITHUB_ENV"
          echo 'Android SDK packages are ready.'

      - name: Validate Gradle project configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle tasks --no-daemon --stacktrace --warning-mode all

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace --warning-mode all

      - name: Select release APK
        shell: bash
        run: |
          set -euo pipefail
          apk_dir="$PROJECT_DIR/app/build/outputs/apk/release"
          apks=()
          while IFS= read -r -d '' file; do
            apks+=("$file")
          done < <(find "$apk_dir" -type f -name '*.apk' -print0 | sort -z)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one release APK; found ${#apks[@]}"
            printf ' %s\n' "${apks[@]:-NONE}"
            exit 1
          fi
          cp "${apks[0]}" "$GITHUB_WORKSPACE/unsigned.apk"
          echo "UNSIGNED_APK=$GITHUB_WORKSPACE/unsigned.apk" >> "$GITHUB_ENV"

      - name: Verify unsigned APK metadata
        shell: bash
        run: |
          set -euo pipefail
          "$BUILD_TOOLS_DIR/aapt" dump badging "$UNSIGNED_APK" > unsigned.badging
          grep -q "package: name='$PACKAGE_NAME'" unsigned.badging
          grep -q "versionCode='$VERSION_CODE'" unsigned.badging
          grep -q "versionName='$VERSION_NAME'" unsigned.badging
          grep -q "targetSdkVersion:'37'" unsigned.badging

      - name: Align APK for 16 KB page compatibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          "$BUILD_TOOLS_DIR/zipalign" -f -P 16 4 "$UNSIGNED_APK" output/EANUXX-v0.6.0-aligned.apk
          echo "ALIGNED_APK=$GITHUB_WORKSPACE/output/EANUXX-v0.6.0-aligned.apk" >> "$GITHUB_ENV"

      - name: Verify alignment
        shell: bash
        run: |
          set -euo pipefail
          "$BUILD_TOOLS_DIR/zipalign" -c -P 16 -v 4 "$ALIGNED_APK"

      - name: Verify resources.arsc is uncompressed
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$ALIGNED_APK" <<'PY'
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              info = z.getinfo('resources.arsc')
              if info.compress_type != zipfile.ZIP_STORED:
                  raise SystemExit('ERROR: resources.arsc is compressed')
          print('resources.arsc: uncompressed')
          PY

      - name: Restore signing certificate
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.EANUXX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "${KEYSTORE_BASE64:-}" ]
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > EANUXX-release.p12
          chmod 600 EANUXX-release.p12
          [ -s EANUXX-release.p12 ]

      - name: Verify signing certificate
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${KEYSTORE_PASSWORD:-}" ]
          keytool -list -v -storetype PKCS12 -keystore EANUXX-release.p12 -storepass "$KEYSTORE_PASSWORD" > certificate.txt
          actual="$(awk -F': ' 'tolower($1) == "sha256" { gsub(":", "", $2); print toupper($2); exit }' certificate.txt)"
          if [ -z "$actual" ]; then
            echo 'ERROR: SHA-256 certificate fingerprint not found.'
            grep -i 'sha256' certificate.txt || true
            exit 1
          fi
          echo "Keystore certificate SHA-256: $actual"
          echo "Expected certificate SHA-256: $EXPECTED_CERT_SHA256"
          [ "$actual" = "$EXPECTED_CERT_SHA256" ]

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          "$BUILD_TOOLS_DIR/apksigner" sign --ks EANUXX-release.p12 --ks-type PKCS12 --ks-key-alias eanuxx --ks-pass "pass:$KEYSTORE_PASSWORD" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false --out output/EANUXX-v0.6.0-update.apk "$ALIGNED_APK"
          echo "FINAL_APK=$GITHUB_WORKSPACE/output/EANUXX-v0.6.0-update.apk" >> "$GITHUB_ENV"

      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$FINAL_APK" 2>&1 | tee signature.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' signature.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' signature.txt
          actual="$(awk -F': ' 'tolower($1) ~ /certificate sha-256 digest/ { gsub(":", "", $2); print toupper($2); exit }' signature.txt)"
          if [ -z "$actual" ]; then
            echo 'ERROR: APK certificate SHA-256 digest not found.'
            grep -i 'certificate sha-256' signature.txt || true
            exit 1
          fi
          echo "Expected certificate: $EXPECTED_CERT_SHA256"
          echo "APK certificate: $actual"
          [ "$actual" = "$EXPECTED_CERT_SHA256" ]

      - name: Verify final APK integrity and metadata
        shell: bash
        run: |
          set -euo pipefail
          "$BUILD_TOOLS_DIR/zipalign" -c -P 16 -v 4 "$FINAL_APK"
          unzip -t "$FINAL_APK" >/dev/null
          "$BUILD_TOOLS_DIR/aapt" dump badging "$FINAL_APK" > final.badging
          grep -q "package: name='$PACKAGE_NAME'" final.badging
          grep -q "versionCode='$VERSION_CODE'" final.badging
          grep -q "versionName='$VERSION_NAME'" final.badging
          grep -q "targetSdkVersion:'37'" final.badging
          echo 'Final APK checks passed.'

      - name: Generate checksum
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "$FINAL_APK" | tee output/EANUXX-v0.6.0-update.sha256
          ls -lh "$FINAL_APK" output/EANUXX-v0.6.0-update.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EANUXX-v0.6.0-Android17-Update
          path: |
            output/EANUXX-v0.6.0-update.apk
            output/EANUXX-v0.6.0-update.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing material
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          rm -f -- EANUXX-release.p12 certificate.txt signature.txt unsigned.apk unsigned.badging final.badging
          echo 'Signing material removed.'
