name: Build EANUXX APK - Update Safe

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract EANUXX source
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking repository files..."
          ls -lah

          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No source ZIP file was found."
            exit 1
          fi

          echo "Found source ZIP:"
          echo "$ZIP"

          rm -rf source

          mkdir -p source

          unzip -q "$ZIP" -d source

          echo "Extracted files:"
          find source -maxdepth 3 -type f | head -100

          if [ ! -f "source/EANUXX/settings.gradle.kts" ]; then
            echo "ERROR: Android project was not found at source/EANUXX."
            echo "Searching for settings.gradle.kts..."
            find source -name settings.gradle.kts -print
            exit 1
          fi

          echo "EANUXX Android project found successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Android project
        working-directory: source/EANUXX
        shell: bash
        run: |
          set -euo pipefail

          echo "Project directory:"
          pwd

          echo "Project files:"
          ls -lah

          echo "Gradle files:"
          find . -maxdepth 2 -type f \
            -name "*.gradle" -o -name "*.gradle.kts" \
            -print

      - name: Build release APK
        working-directory: source/EANUXX
        shell: bash
        run: |
          set -euo pipefail

          echo "Building EANUXX release APK..."

          gradle --no-daemon clean assembleRelease

          echo "Build output:"
          find app/build/outputs -type f -print

      - name: Check unsigned APK
        shell: bash
        run: |
          set -euo pipefail

          APK="source/EANUXX/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not created."
            find source/EANUXX/app/build/outputs -type f -print
            exit 1
          fi

          echo "Unsigned APK found:"
          ls -lh "$APK"

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail

          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" \
            -name zipalign \
            -type f \
            | sort -V \
            | tail -1)"

          if [ -z "$ZIPALIGN" ]; then
            echo "ERROR: zipalign was not found."
            exit 1
          fi

          echo "Using:"
          echo "$ZIPALIGN"

          "$ZIPALIGN" -f -p 4 \
            source/EANUXX/app/build/outputs/apk/release/app-release-unsigned.apk \
            source/EANUXX/app/build/outputs/apk/release/EANUXX-aligned.apk

          echo "APK alignment completed."

      - name: Restore EANUXX signing certificate
        env:
          KEYSTORE_B64: ${{ secrets.EANUXX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_B64" ];
