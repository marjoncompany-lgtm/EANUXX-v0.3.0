name: Build EANUXX APK - Update Safe

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract EANUXX source
        shell: bash
        run: |
          set -euo pipefail
ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: UpdateSafe source ZIP not found."
            exit 1
          fi

          echo "Found source: $ZIP"

          rm -rf source
          unzip -q "$ZIP" -d source

          if [ ! -f "source/EANUXX/settings.gradle.kts" ]; then
            echo "ERROR: EANUXX Android project was not found."
            find source -maxdepth 3 -type f | head -100
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        working-directory: source/EANUXX
        run: |
          gradle --no-daemon clean assembleRelease

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail

          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" \
            -name zipalign -type f | sort -V | tail -1)"

          if [ -z "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          "$ZIPALIGN" -f -p 4 \
            source/EANUXX/app/build/outputs/apk/release/app-release-unsigned.apk \
            source/EANUXX/app/build/outputs/apk/release/EANUXX-aligned.apk

      - name: Restore EANUXX signing certificate
        env:
          KEYSTORE_B64: ${{ secrets.EANUXX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: EANUXX_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: EANUXX_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_B64" | base64 --decode > EANUXX-release.p12

          echo "PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Verify installed-app certificate
        shell: bash
        run: |
          set -euo pipefail

          FINGERPRINT="$(
            keytool -list -v \
              -storetype PKCS12 \
              -keystore EANUXX-release.p12 \
              -storepass "$PASS" \
              -alias eanuxx |
              awk -F': ' '/SHA256:/{print $2; exit}'
          )"

          EXPECTED='95:3F:44:4B:65:59:4F:10:FC:C4:56:A7:F5:44:3F:DB:95:54:AF:46:F9:A5:FB:72:BF:24:92:91:C8:48:C7:E0'

          echo "Signing certificate:"
          echo "$FINGERPRINT"

          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "ERROR: WRONG CERTIFICATE."
            echo "The APK was NOT signed because it would not be update-compatible."
            exit 1
          fi

          echo "Certificate matches the existing EANUXX certificate."

      - name: Sign APK with V1 V2 V3
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -name apksigner -type f | sort -V | tail -1
          )"

          "$APKSIGNER" sign \
            --ks EANUXX-release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias eanuxx \
            --ks-pass env:PASS \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out source/EANUXX/app/build/outputs/apk/release/EANUXX-Livestreaming-Studio-v0.3.0-update.apk \
            source/EANUXX/app/build/outputs/apk/release/EANUXX-aligned.apk

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            source/EANUXX/app/build/outputs/apk/release/EANUXX-Livestreaming-Studio-v0.3.0-update.apk

      - name: Verify package and version
        shell: bash
        run: |
          set -euo pipefail

          APK="source/EANUXX/app/build/outputs/apk/release/EANUXX-Livestreaming-Studio-v0.3.0-update.apk"

          AAPT="$(
            find "$ANDROID_HOME/build-tools" \
              -name aapt -type f | sort -V | tail -1
          )"

          "$AAPT" dump badging "$APK" |
            grep "package: name='com.wEANUXX_20148007' versionCode='3' versionName='0.3.0-functional-update'"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EANUXX-Livestreaming-Studio-v0.3.0-update
          path: source/EANUXX/app/build/outputs/apk/release/EANUXX-Livestreaming-Studio-v0.3.0-update.apk
          if-no-files-found: error
