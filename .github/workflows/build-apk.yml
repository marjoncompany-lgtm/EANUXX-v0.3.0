name: Build EANUXX Android 17 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  SOURCE_ZIP: EANUXX_Livestreaming_Studio_v0.4.0_ANDROID17_HARDENED_V3_SOURCE.zip
  EXPECTED_SOURCE_SHA256: 20045f871722c4f86ea3a83fee8a86d872041fd6646791cbadaffd60d02225b9

  ANDROID_PLATFORM: android-37.0
  BUILD_TOOLS_VERSION: 37.0.0

  GRADLE_VERSION: 9.6.1
  JAVA_VERSION: "17"

  PACKAGE_NAME: com.wEANUXX_20148007
  EXPECTED_VERSION_CODE: "5"
  EXPECTED_VERSION_NAME: 0.4.0-professional-update

  KEYSTORE_FILE: EANUXX-release.p12
  KEYSTORE_ALIAS: eanuxx

  EXPECTED_CERT_SHA256: 953F444B65594F10FCC456A7F5443FDB9554AF46F9A5FB72BF249291C848C7E0

jobs:
  build:
    name: Build signed EANUXX APK
    runs-on: ubuntu-24.04

    steps:

      # ------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7

      # ------------------------------------------------------------
      # 2. LOCATE SOURCE ZIP
      # ------------------------------------------------------------

      - name: Locate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository root:"
          pwd

          echo
          echo "Repository files:"
          find . -maxdepth 2 -type f | sort

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo
            echo "ERROR: Expected source ZIP was not found:"
            echo "$SOURCE_ZIP"
            exit 1
          fi

          ZIP_COUNT="$(find . -maxdepth 1 -type f -name '*.zip' | wc -l)"

          if [ "$ZIP_COUNT" -ne 1 ]; then
            echo
            echo "ERROR: Repository root must contain exactly one source ZIP."
            echo "Found: $ZIP_COUNT"
            find . -maxdepth 1 -type f -name '*.zip' -print
            exit 1
          fi

          echo
          echo "Source ZIP:"
          echo "$SOURCE_ZIP"

      # ------------------------------------------------------------
      # 3. VERIFY SOURCE ZIP
      # ------------------------------------------------------------

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing ZIP integrity..."

          unzip -t "$SOURCE_ZIP" >/dev/null

          ACTUAL_SHA256="$(sha256sum "$SOURCE_ZIP" | awk '{print $1}')"

          echo
          echo "Actual SHA-256:"
          echo "$ACTUAL_SHA256"

          echo
          echo "Expected SHA-256:"
          echo "$EXPECTED_SOURCE_SHA256"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SOURCE_SHA256" ]; then
            echo
            echo "ERROR: Source ZIP SHA-256 does not match."
            exit 1
          fi

          echo
          echo "Source ZIP verified successfully."

      # ------------------------------------------------------------
      # 4. EXTRACT SOURCE
      # ------------------------------------------------------------

      - name: Extract source project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf app-source
          mkdir -p app-source

          unzip -q "$SOURCE_ZIP" -d app-source

          echo "Extracted files:"
          find app-source -maxdepth 3 -type f | sort

          SETTINGS_FILE="$(find app-source -type f \
            \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo
            echo "ERROR: Gradle settings file was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo
            echo "ERROR: Android app module was not found."
            echo "Project directory: $PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "Gradle project:"
          echo "$PROJECT_DIR"

      # ------------------------------------------------------------
      # 5. VERIFY PROJECT CONFIGURATION
      # ------------------------------------------------------------

      - name: Verify Android 17 project configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android project configuration..."

          if ! grep -Rqs "compileSdk[[:space:]]*=[[:space:]]*37" app; then
            echo "ERROR: compileSdk 37 was not found."
            exit 1
          fi

          if ! grep -Rqs "targetSdk[[:space:]]*=[[:space:]]*37" app; then
            echo "ERROR: targetSdk 37 was not found."
            exit 1
          fi

          if ! grep -Rqs "requireLensFacing" app/src; then
            echo "ERROR: CameraX requireLensFacing() was not found."
            exit 1
          fi

          if ! grep -Rqs "versionCode[[:space:]]*=[[:space:]]*5" app; then
            echo "ERROR: versionCode 5 was not found."
            exit 1
          fi

          if ! grep -Rqs "0.4.0-professional-update" app; then
            echo "ERROR: expected versionName was not found."
            exit 1
          fi

          echo
          echo "Android 17 configuration verified."

      # ------------------------------------------------------------
      # 6. JAVA 17
      # ------------------------------------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------------------------
      # 7. GRADLE 9.6.1
      # ------------------------------------------------------------

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.6.1

      # ------------------------------------------------------------
      # 8. VERIFY JAVA / GRADLE
      # ------------------------------------------------------------

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          gradle --version

      # ------------------------------------------------------------
      # 9. INSTALL ANDROID 37 SDK
      # ------------------------------------------------------------

      - name: Install Android 37 SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found:"
            echo "$SDKMANAGER"
            exit 1
          fi

          echo "Installing Android SDK platform:"
          echo "platforms;$ANDROID_PLATFORM"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;$ANDROID_PLATFORM" \
            "build-tools;$BUILD_TOOLS_VERSION"

          echo
          echo "Installed Android SDK packages:"
          "$SDKMANAGER" --list_installed

      # ------------------------------------------------------------
      # 10. VERIFY SDK
      # ------------------------------------------------------------

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_DIR="$ANDROID_SDK_ROOT"

          if [ ! -d "$SDK_DIR/platforms/$ANDROID_PLATFORM" ]; then
            echo "ERROR: Android platform was not installed."
            exit 1
          fi

          ZIPALIGN="$SDK_DIR/build-tools/$BUILD_TOOLS_VERSION/zipalign"
          APKSIGNER="$SDK_DIR/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          if [ ! -x "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo "Android SDK verified."

      # ------------------------------------------------------------
      # 11. BUILD RELEASE APK
      # ------------------------------------------------------------

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting Gradle release build..."

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

          echo
          echo "APK files produced:"
          find app/build/outputs/apk -type f -name '*.apk' -print

      # ------------------------------------------------------------
      # 12. LOCATE UNSIGNED APK
      # ------------------------------------------------------------

      - name: Locate release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not found."
            exit 1
          fi

          echo "UNSIGNED_APK=$APK" >> "$GITHUB_ENV"

          echo
          echo "Release APK:"
          echo "$APK"

      # ------------------------------------------------------------
      # 13. ALIGN APK
      # ------------------------------------------------------------

      - name: Align APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/zipalign"

          FINAL_UNSIGNED="app/build/outputs/apk/release/EANUXX-release-aligned.apk"

          "$ZIPALIGN" \
            -f \
            -p \
            16 \
            "$UNSIGNED_APK" \
            "$FINAL_UNSIGNED"

          if [ ! -f "$FINAL_UNSIGNED" ]; then
            echo "ERROR: Aligned APK was not created."
            exit 1
          fi

          echo "ALIGNED_APK=$PROJECT_DIR/$FINAL_UNSIGNED" >> "$GITHUB_ENV"

          echo
          echo "Aligned APK:"
          echo "$FINAL_UNSIGNED"

      # ------------------------------------------------------------
      # 14. VERIFY APK ALIGNMENT
      # ------------------------------------------------------------

      - name: Verify APK alignment
        shell: bash
        run: |
          set -euo pipefail

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/zipalign"

          "$ZIPALIGN" -c -P 16 -v 4 "$ALIGNED_APK"

          echo
          echo "APK alignment verified."

      # ------------------------------------------------------------
      # 15. VERIFY resources.arsc
      # ------------------------------------------------------------

      - name: Verify resources.arsc
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$ALIGNED_APK" <<'PY'
          import sys
          import zipfile

          apk = sys.argv[1]

          with zipfile.ZipFile(apk, "r") as z:
              info = z.getinfo("resources.arsc")

              if info.compress_type != zipfile.ZIP_STORED:
                  print("ERROR: resources.arsc is compressed.")
                  sys.exit(1)

              print("resources.arsc is uncompressed.")
          PY

      # ------------------------------------------------------------
      # 16. RESTORE SIGNING KEY
      # ------------------------------------------------------------

      - name: Restore EANUXX signing certificate
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.EANUXX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: EANUXX_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          chmod 600 "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo "Signing keystore restored."

      # ------------------------------------------------------------
      # 17. VERIFY SIGNING CERTIFICATE
      # ------------------------------------------------------------

      - name: Verify signing certificate
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: EANUXX_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          echo "Reading certificate from keystore..."

          keytool \
            -list \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEYSTORE_ALIAS" \
            > keystore-cert.txt

          CERT_SHA256="$(
            grep -i "SHA256:" keystore-cert.txt |
            head -n 1 |
            sed 's/.*SHA256:[[:space:]]*//' |
            tr -d ':' |
            tr -d '[:space:]' |
            tr '[:lower:]' '[:upper:]'
          )"

          echo "Keystore certificate SHA-256:"
          echo "$CERT_SHA256"

          echo
          echo "Expected certificate SHA-256:"
          echo "$EXPECTED_CERT_SHA256"

          if [ "$CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo
            echo "ERROR: Wrong EANUXX signing certificate."
            exit 1
          fi

          echo
          echo "Correct EANUXX signing certificate confirmed."

      # ------------------------------------------------------------
      # 18. SIGN APK
      # ------------------------------------------------------------

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          FINAL_APK="$GITHUB_WORKSPACE/EANUXX_Livestreaming_Studio_v0.4.0.apk"

          rm -f "$FINAL_APK"

          "$APKSIGNER" sign \
            --ks "$GITHUB_WORKSPACE/$KEYSTORE_FILE" \
            --ks-type PKCS12 \
            --ks-key-alias "$KEYSTORE_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          if [ ! -f "$FINAL_APK" ]; then
            echo "ERROR: Signed APK was not created."
            exit 1
          fi

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

          echo
          echo "Signed APK:"
          ls -lh "$FINAL_APK"

      # ------------------------------------------------------------
      # 19. VERIFY FINAL SIGNATURE
      # ------------------------------------------------------------

      - name: Verify final APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          echo "=== APK SIGNATURE VERIFICATION ==="

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$FINAL_APK"

          echo
          echo "APK signature verification completed."

      # ------------------------------------------------------------
      # 20. VERIFY FINAL CERTIFICATE
      # ------------------------------------------------------------

      - name: Verify final certificate
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          "$APKSIGNER" verify \
            --print-certs \
            "$FINAL_APK" > apk-cert.txt

          echo
          echo "APK certificate information:"
          cat apk-cert.txt

          APK_CERT_SHA256="$(
            grep -i "certificate SHA-256 digest" apk-cert.txt |
            head -n 1 |
            sed -E 's/.*:[[:space:]]*//' |
            tr -d ':' |
            tr -d '[:space:]' |
            tr '[:lower:]' '[:upper:]'
          )"

          echo
          echo "APK certificate SHA-256:"
          echo "$APK_CERT_SHA256"

          echo
          echo "Expected certificate SHA-256:"
          echo "$EXPECTED_CERT_SHA256"

          if [ -z "$APK_CERT_SHA256" ]; then
            echo
            echo "ERROR: Could not extract APK certificate SHA-256."
            exit 1
          fi

          if [ "$APK_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo
            echo "ERROR: APK certificate does not match EANUXX certificate."
            exit 1
          fi

          echo
          echo "Final APK certificate is correct."

      # ------------------------------------------------------------
      # 21. VERIFY APK PACKAGE / VERSION
      # ------------------------------------------------------------

      - name: Verify APK package and version
        shell: bash
        run: |
          set -euo pipefail

          APKTOOL="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/aapt2"

          if [ ! -x "$APKTOOL" ]; then
            echo "ERROR: aapt2 was not found."
            exit 1
          fi

          DUMP="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/aapt2 dump badging "$FINAL_APK""

          PACKAGE_LINE="$(eval "$DUMP" | grep "^package:" | head -n 1)"

          echo
          echo "Package information:"
          echo "$PACKAGE_LINE"

          if ! echo "$PACKAGE_LINE" | grep -q "name='$PACKAGE_NAME'"; then
            echo
            echo "ERROR: Package name does not match."
            exit 1
          fi

          if ! echo "$PACKAGE_LINE" | grep -q "versionCode='$EXPECTED_VERSION_CODE'"; then
            echo
            echo "ERROR: Version code does not match."
            exit 1
          fi

          if ! echo "$PACKAGE_LINE" | grep -q "versionName='$EXPECTED_VERSION_NAME'"; then
            echo
            echo "ERROR: Version name does not match."
            exit 1
          fi

          echo
          echo "Package and version verified."

      # ------------------------------------------------------------
      # 22. FINAL ZIP / ALIGNMENT CHECK
      # ------------------------------------------------------------

      - name: Final APK integrity checks
        shell: bash
        run: |
          set -euo pipefail

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/zipalign"

          echo "Checking ZIP integrity..."

          unzip -t "$FINAL_APK" >/dev/null

          echo "Checking 16 KB alignment..."

          "$ZIPALIGN" -c -P 16 -v 4 "$FINAL_APK"

          echo
          echo "Checking resources.arsc..."

          python3 - "$FINAL_APK" <<'PY'
          import sys
          import zipfile

          apk = sys.argv[1]

          with zipfile.ZipFile(apk, "r") as z:
              info = z.getinfo("resources.arsc")

              if info.compress_type != zipfile.ZIP_STORED:
                  print("ERROR: resources.arsc is compressed.")
                  sys.exit(1)

              print("resources.arsc: uncompressed")
          PY

          echo
          echo "Final APK integrity checks passed."

      # ------------------------------------------------------------
      # 23. SHA-256
      # ------------------------------------------------------------

      - name: Generate APK SHA-256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum "$FINAL_APK" | tee EANUXX_Livestreaming_Studio_v0.4.0.apk.sha256

      # ------------------------------------------------------------
      # 24. SHOW FINAL INFORMATION
      # ------------------------------------------------------------

      - name: Final build information
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=============================================="
          echo "EANUXX BUILD SUCCESS"
          echo "=============================================="
          echo
          echo "APK:"
          echo "$FINAL_APK"
          echo
          echo "Package:"
          echo "$PACKAGE_NAME"
          echo
          echo "Version Code:"
          echo "$EXPECTED_VERSION_CODE"
          echo
          echo "Version Name:"
          echo "$EXPECTED_VERSION_NAME"
          echo
          echo "Compile SDK:"
          echo "37"
          echo
          echo "Target SDK:"
          echo "37"
          echo
          echo "Android platform:"
          echo "$ANDROID_PLATFORM"
          echo
          echo "Signing certificate:"
          echo "$EXPECTED_CERT_SHA256"
          echo
          echo "APK SHA-256:"
          cat EANUXX_Livestreaming_Studio_v0.4.0.apk.sha256
          echo
          echo "=============================================="

      # ------------------------------------------------------------
      # 25. UPLOAD APK
      # ------------------------------------------------------------

      - name: Upload EANUXX APK
        uses: actions/upload-artifact@v5
        with:
          name: EANUXX-Livestreaming-Studio-v0.4.0-Android17
          path: |
            EANUXX_Livestreaming_Studio_v0.4.0.apk
            EANUXX_Livestreaming_Studio_v0.4.0.apk.sha256
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # 26. CLEANUP
      # ------------------------------------------------------------

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          set +e

          rm -f "$GITHUB_WORKSPACE/EANUXX-release.p12"
          rm -f "$GITHUB_WORKSPACE/keystore-cert.txt"
          rm -f "$GITHUB_WORKSPACE/apk-cert.txt"

          echo "Signing material cleanup completed."