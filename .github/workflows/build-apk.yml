name: EANUXX Android Release - Update Safe

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-apk.yml"
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eanuxx-release-main
  cancel-in-progress: true

jobs:
  build:
    name: Build, align, sign and verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate source package
        id: source
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          zips=( ./*.zip )
          shopt -u nullglob

          if [ "${#zips[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one source ZIP at repository root."
            echo "Found ${#zips[@]} ZIP file(s):"
            printf ' - %s\n' "${zips[@]:-<none>}"
            exit 1
          fi

          ZIP="${zips[0]}"
          echo "Source ZIP: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          unzip -q "${{ steps.source.outputs.zip }}" -d source

          test -f source/EANUXX/settings.gradle.kts
          test -f source/EANUXX/build.gradle.kts
          test -f source/EANUXX/app/build.gradle.kts

          echo "Android project validated at source/EANUXX."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Android project
        working-directory: source/EANUXX
        shell: bash
        run: |
          set -euo pipefail

          echo "Project directory:"
          pwd

          echo "Gradle configuration:"
          find . -maxdepth 2 -type f \( \
            -name "*.gradle" -o \
            -name "*.gradle.kts" \
          \) -print

          echo "Checking Gradle configuration..."
          gradle --no-daemon tasks --all >/dev/null

          echo "Android project verification successful."

      - name: Build unsigned release APK
        working-directory: source/EANUXX
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon clean assembleRelease

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"

          echo "Unsigned APK:"
          ls -lh "$APK"

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail

          APK="source/EANUXX/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="source/EANUXX/app/build/outputs/apk/release/EANUXX-aligned.apk"

          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" \ -type f -name zipalign \ | sort -V \ | tail -1)"

          test -n "$ZIPALIGN"

          "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED"

          echo "Checking ZIP alignment..."
          "$ZIPALIGN" -c -P 4 -v 4 "$ALIGNED"

      - name: Verify resources.arsc format and alignment
        shell: bash
        run: |
          set -euo pipefail

          ALIGNED="source/EANUXX/app/build/outputs/apk/release/EANUXX-aligned.apk"

          python3 - "$ALIGNED" <<'PY'
          import sys
          import zipfile

          apk = sys.argv[1]

          with zipfile.ZipFile(apk, "r") as z:
              info = z.getinfo("resources.arsc")

              if info.compress_type != zipfile.ZIP_STORED:
                  raise SystemExit(
                      "ERROR: resources.arsc is compressed; it must be uncompressed."
                  )

              # Local file header offset + fixed header (30 bytes)
              # + filename + extra field = data offset.
              data_offset = (
                  info.header_offset
                  + 30
                  + len(info.filename.encode("utf-8"))
                  + len(info.extra)
              )

              if data_offset % 4 != 0:
                  raise SystemExit(
                      f"ERROR: resources.arsc data offset is not 4-byte aligned: {data_offset}"
                  )

              print("resources.arsc is uncompressed and 4-byte aligned.")
          PY

      - name: Restore EANUXX signing certificate
        env:
          KEYSTORE_B64: ${{ secrets.EANUXX_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "ERROR: EANUXX_KEYSTORE_BASE64 repository secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_B64" | base64 --decode > EANUXX-release.p12
          chmod 600 EANUXX-release.p12

          echo "Signing certificate restored."

      - name: Verify existing EANUXX certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: EANUXX_KEYSTORE_PASSWORD repository secret is missing."
            exit 1
          fi

          FINGERPRINT="$( keytool -list -v \ -storetype PKCS12 \ -keystore EANUXX-release.p12 \ -storepass "$KEYSTORE_PASSWORD" \ -alias eanuxx \ | awk -F': ' '/SHA256:/{print $2; exit}' )"

          EXPECTED="95:3F:44:4B:65:59:4F:10:FC:C4:56:A7:F5:44:3F:DB:95:54:AF:46:F9:A5:FB:72:BF:24:92:91:C8:48:C7:E0"

          echo "Certificate SHA-256:"
          echo "$FINGERPRINT"

          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "ERROR: Signing certificate does not match the installed EANUXX certificate."
            echo "Build stopped to protect update compatibility."
            exit 1
          fi

          echo "Existing EANUXX signing certificate confirmed."

      - name: Sign APK with V1, V2 and V3
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \ -type f -name apksigner \ | sort -V \ | tail -1)"

          test -n "$APKSIGNER"

          INPUT="source/EANUXX/app/build/outputs/apk/release/EANUXX-aligned.apk"
          OUTPUT="source/EANUXX/app/build/outputs/apk/release/EANUXX-Livestreaming-Studio-v0.3.0-update.apk"

          "$APKSIGNER" sign \
            --ks EANUXX-release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias eanuxx \
            --ks-pass env:KEYSTORE_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUTPUT" \
            "$INPUT"

          test -f "$OUTPUT"
          echo "Signed APK created:"
          ls -lh "$OUTPUT"

      - name: Verify APK signatures
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \ -type f -name apksigner \ | sort -V \ | tail -1)"

          APK="source/EANUXX/app/build/outputs/apk/release/EANUXX-Livestreaming-Studio-v0.3.0-update.apk"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo "APK signature verification successful."

      - name: Verify package, version and certificate
        shell: bash
        run: |
          set -euo pipefail

          APK="source/EANUXX/app/build/outputs/apk/release/EANUXX-Livestreaming-Studio-v0.3.0-update.apk"

          AAPT="$(find "$ANDROID_HOME/build-tools" \ -type f -name aapt \ | sort -V \ | tail -1)"

          test -n "$AAPT"

          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING"

          echo "$BADGING" | grep -F \
            "package: name='com.wEANUXX_20148007' versionCode='3' versionName='0.3.0-functional-update'"

          EXPECTED="95:3F:44:4B:65:59:4F:10:FC:C4:56:A7:F5:44:3F:DB:95:54:AF:46:F9:A5:FB:72:BF:24:92:91:C8:48:C7:E0"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \ -type f -name apksigner \ | sort -V \ | tail -1)"

          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "$CERT_OUTPUT"

          echo "$CERT_OUTPUT" | grep -F "$EXPECTED"

          echo "Package, version and signing certificate verified."

      - name: Final APK integrity check
        shell: bash
        run: |
          set -euo pipefail

          APK="source/EANUXX/app/build/outputs/apk/release/EANUXX-Livestreaming-Studio-v0.3.0-update.apk"

          python3 - "$APK" <<'PY'
          import sys
          import zipfile

          apk = sys.argv[1]

          with zipfile.ZipFile(apk, "r") as z:
              bad = z.testzip()
              if bad is not None:
                  raise SystemExit(f"ERROR: Corrupt ZIP entry: {bad}")

          print("APK ZIP integrity check successful.")
          PY

          echo "Final APK:"
          ls -lh "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: EANUXX-Livestreaming-Studio-v0.3.0-update
          path: source/EANUXX/app/build/outputs/apk/release/EANUXX-Livestreaming-Studio-v0.3.0-update.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          rm -f EANUXX-release.p12
          echo "Temporary signing material removed."          unzip -q "$ZIP" -d source

          echo "Extracted files:"
          find source -maxdepth 3 -type f | head -100

          if [ ! -f "source/EANUXX/settings.gradle.kts" ]; then
            echo "ERROR: Android project was not found at source/EANUXX."
            echo "Searching for settings.gradle.kts..."
            find source -name settings.gradle.kts -print
            exit 1
          fi

          echo "EANUXX Android project found successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Android project
        working-directory: source/EANUXX
        shell: bash
        run: |
          set -euo pipefail

          echo "Project directory:"
          pwd

          echo "Project files:"
          ls -lah

          echo "Gradle files:"
          find . -maxdepth 2 -type f -name "*.gradle" -print
          find . -maxdepth 2 -type f -name "*.gradle.kts" -print

          if [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts is missing."
            exit 1
          fi

          if [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: build.gradle.kts is missing."
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts is missing."
            exit 1
          fi

          echo "Android project verification successful."

      - name: Build release APK
        working-directory: source/EANUXX
        shell: bash
        run: |
          set -euo pipefail

          echo "Building EANUXX release APK..."
          gradle --no-daemon clean assembleRelease

          echo "Build output:"
          find app/build/outputs -type f -print

      - name: Check unsigned APK
        shell: bash
        run: |
          set -euo pipefail

          APK="source/EANUXX/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not created."
            find source/EANUXX/app/build/outputs -type f -print
            exit 1
          fi

          echo "Unsigned APK found:"
          ls -lh "$APK"

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail

          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)"

          if [ -z "$ZIPALIGN" ]; then
            echo "ERROR: zipalign was not found."
            exit 1
          fi

          echo "Using:"
          echo "$ZIPALIGN"

          "$ZIPALIGN" -f -p 4 \
            source/EANUXX/app/build/outputs/apk/release/app-release-unsigned.apk \
            source/EANUXX/app/build/outputs/apk/release/EANUXX-aligned.apk

          echo "APK alignment completed."

      - name: Restore EANUXX signing certificate
        env:
          KEYSTORE_B64: ${{ secrets.EANUXX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: EANUXX_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: EANUXX_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_B64" | base64 --decode > EANUXX-release.p12
          chmod 600 EANUXX-release.p12

          echo "PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

          echo "Signing keystore restored."

      - name: Verify EANUXX signing certificate
        shell: bash
        run: |
          set -euo pipefail

          FINGERPRINT="$( keytool -list -v \ -storetype PKCS12 \ -keystore EANUXX-release.p12 \ -storepass "$PASS" \ -alias eanuxx \ | awk -F': ' '/SHA256:/{print $2; exit}' )"

          EXPECTED='95:3F:44:4B:65:59:4F:10:FC:C4:56:A7:F5:44:3F:DB:95:54:AF:46:F9:A5:FB:72:BF:24:92:91:C8:48:C7:E0'

          echo "Detected certificate SHA-256:"
          echo "$FINGERPRINT"

          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo ""
            echo "ERROR: SIGNING CERTIFICATE DOES NOT MATCH."
            echo "The APK will NOT be signed."
            echo "This prevents creating an APK that cannot update the installed EANUXX app."
            exit 1
          fi

          echo ""
          echo "SUCCESS: Existing EANUXX certificate verified."
          echo "Update-compatible signing certificate confirmed."

      - name: Sign APK V1 V2 V3
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          echo "Using:"
          echo "$APKSIGNER"

          "$APKSIGNER" sign \
            --ks EANUXX-release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias eanuxx \
            --ks-pass env:PASS \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out source/EANUXX/app/build/outputs/apk/release/EANUXX-Livestreaming-Studio-v0.3.0-update.apk \
            source/EANUXX/app/build/outputs/apk/release/EANUXX-aligned.apk

          echo "APK signing completed."

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="source/EANUXX/app/build/outputs/apk/release/EANUXX-Livestreaming-Studio-v0.3.0-update.apk"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"

          echo "Verifying APK signature..."

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo "APK signature verification completed."

      - name: Verify package and version
        shell: bash
        run: |
          set -euo pipefail

          APK="source/EANUXX/app/build/outputs/apk/release/EANUXX-Livestreaming-Studio-v0.3.0-update.apk"

          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"

          if [ -z "$AAPT" ]; then
            echo "ERROR: aapt was not found."
            exit 1
          fi

          echo "APK package information:"
          "$AAPT" dump badging "$APK"

          echo ""
          echo "Checking package and version..."

          "$AAPT" dump badging "$APK" | grep "package: name='com.wEANUXX_20148007' versionCode='3' versionName='0.3.0-functional-update'"

          echo ""
          echo "SUCCESS: Package name and version verified."

      - name: Final APK check
        shell: bash
        run: |
          set -euo pipefail

          APK="source/EANUXX/app/build/outputs/apk/release/EANUXX-Livestreaming-Studio-v0.3.0-update.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Final APK does not exist."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "EANUXX APK BUILD SUCCESSFUL"
          echo "======================================"
          echo ""
          echo "Final APK:"
          ls -lh "$APK"
          echo ""
          echo "Location:"
          echo "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EANUXX-Livestreaming-Studio-v0.3.0-update
          path: source/EANUXX/app/build/outputs/apk/release/EANUXX-Livestreaming-Studio-v0.3.0-update.apk
          if-no-files-found: error
          mkdir -p source

          unzip -q "$ZIP" -d source

          echo "Extracted files:"
          find source -maxdepth 3 -type f | head -100

          if [ ! -f "source/EANUXX/settings.gradle.kts" ]; then
            echo "ERROR: Android project was not found at source/EANUXX."
            echo "Searching for settings.gradle.kts..."
            find source -name settings.gradle.kts -print
            exit 1
          fi

          echo "EANUXX Android project found successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Android project
        working-directory: source/EANUXX
        shell: bash
        run: |
          set -euo pipefail

          echo "Project directory:"
          pwd

          echo "Project files:"
          ls -lah

          echo "Gradle files:"
          find . -maxdepth 2 -type f \
            -name "*.gradle" -o -name "*.gradle.kts" \
            -print

      - name: Build release APK
        working-directory: source/EANUXX
        shell: bash
        run: |
          set -euo pipefail

          echo "Building EANUXX release APK..."

          gradle --no-daemon clean assembleRelease

          echo "Build output:"
          find app/build/outputs -type f -print

      - name: Check unsigned APK
        shell: bash
        run: |
          set -euo pipefail

          APK="source/EANUXX/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not created."
            find source/EANUXX/app/build/outputs -type f -print
            exit 1
          fi

          echo "Unsigned APK found:"
          ls -lh "$APK"

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail

          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" \
            -name zipalign \
            -type f \
            | sort -V \
            | tail -1)"

          if [ -z "$ZIPALIGN" ]; then
            echo "ERROR: zipalign was not found."
            exit 1
          fi

          echo "Using:"
          echo "$ZIPALIGN"

          "$ZIPALIGN" -f -p 4 \
            source/EANUXX/app/build/outputs/apk/release/app-release-unsigned.apk \
            source/EANUXX/app/build/outputs/apk/release/EANUXX-aligned.apk

          echo "APK alignment completed."

      - name: Restore EANUXX signing certificate
        env:
          KEYSTORE_B64: ${{ secrets.EANUXX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
