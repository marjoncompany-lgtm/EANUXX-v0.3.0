name: EANUXX v0.4.0 Android 16 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-apk.yml"
      - "*.zip"

permissions:
  contents: read

concurrency:
  group: eanuxx-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build EANUXX v0.4.0 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -name "*.zip" -print)

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "ERROR: Repository root must contain exactly one source ZIP."
            echo "Found:"
            printf '%s\n' "${ZIPS[@]:-NONE}"
            exit 1
          fi

          SOURCE_ZIP="${ZIPS[0]}"
          echo "SOURCE_ZIP=${SOURCE_ZIP#./}" >> "$GITHUB_ENV"

          echo "Using source:"
          echo "${SOURCE_ZIP}"

      - name: Validate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "$SOURCE_ZIP" >/dev/null

          echo "Source ZIP is valid."

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf app-source
          mkdir -p app-source

          unzip -q "$SOURCE_ZIP" -d app-source

          if [ ! -f app-source/settings.gradle.kts ] && \
             [ ! -f app-source/settings.gradle ]; then
            echo "ERROR: settings.gradle(.kts) not found."
            find app-source -maxdepth 3 -type f | sort | head -100
            exit 1
          fi

          echo "Source extracted successfully."

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Check Gradle project
        shell: bash
        working-directory: app-source
        run: |
          set -euo pipefail

          gradle --version

      - name: Build release APK
        shell: bash
        working-directory: app-source
        run: |
          set -euo pipefail

          gradle --no-daemon clean assembleRelease

      - name: Locate unsigned APK
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find app-source -type f \
              \( -name "*-release-unsigned.apk" -o -name "*-release.apk" \) \
              -print
          )

          if [ "${#APKS[@]}" -lt 1 ]; then
            echo "ERROR: Release APK was not found."
            find app-source -type f -name "*.apk" -print
            exit 1
          fi

          INPUT_APK="${APKS[0]}"

          echo "INPUT_APK=$INPUT_APK" >> "$GITHUB_ENV"

          echo "Found APK:"
          echo "$INPUT_APK"

      - name: Locate Android build tools
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS_DIR=""

          for DIR in "$ANDROID_HOME"/build-tools/*; do
            if [ -x "$DIR/zipalign" ] && [ -x "$DIR/apksigner" ]; then
              BUILD_TOOLS_DIR="$DIR"
            fi
          done

          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "ERROR: zipalign/apksigner were not found."
            find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f \
              \( -name "zipalign" -o -name "apksigner" \) -print
            exit 1
          fi

          echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> "$GITHUB_ENV"

          echo "Using Android Build Tools:"
          echo "$BUILD_TOOLS_DIR"

      - name: Verify APK metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "=== APK METADATA ==="

          "$BUILD_TOOLS_DIR/aapt" dump badging "$INPUT_APK" \
            | grep -E "package:|sdkVersion:|targetSdkVersion:" || true

          echo
          echo "Expected package:"
          echo "com.wEANUXX_20148007"

          echo "Expected version:"
          echo "versionCode 5"
          echo "versionName 0.4.0-professional-update"

      - name: Align APK for 16 KB page compatibility
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          ALIGNED_APK="output/EANUXX-v0.4.0-aligned.apk"

          "$BUILD_TOOLS_DIR/zipalign" \
            -f \
            -P 16 \
            4 \
            "$INPUT_APK" \
            "$ALIGNED_APK"

          echo "ALIGNED_APK=$ALIGNED_APK" >> "$GITHUB_ENV"

          echo "APK aligned."

      - name: Verify APK alignment
        shell: bash
        run: |
          set -euo pipefail

          "$BUILD_TOOLS_DIR/zipalign" \
            -c \
            -P 16 \
            4 \
            "$ALIGNED_APK"

          echo "16 KB-compatible ZIP alignment verified."

      - name: Verify resources.arsc compression
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$ALIGNED_APK" <<'PY'
          import sys
          import zipfile

          apk = sys.argv[1]

          with zipfile.ZipFile(apk, "r") as z:
              info = z.getinfo("resources.arsc")

              if info.compress_type != zipfile.ZIP_STORED:
                  raise SystemExit(
                      "ERROR: resources.arsc is compressed. "
                      "It must be stored/uncompressed."
                  )

          print("resources.arsc is uncompressed.")
          PY

      - name: Restore signing certificate
        shell: bash
        env:
          EANUXX_KEYSTORE_BASE64: ${{ secrets.EANUXX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${EANUXX_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: EANUXX_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$EANUXX_KEYSTORE_BASE64" \
            | base64 --decode > EANUXX-release.p12

          chmod 600 EANUXX-release.p12

          echo "Signing certificate restored."

      - name: Verify signing certificate
        shell: bash
        env:
          EANUXX_KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${EANUXX_KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: EANUXX_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          keytool \
            -list \
            -v \
            -storetype PKCS12 \
            -keystore EANUXX-release.p12 \
            -storepass "$EANUXX_KEYSTORE_PASSWORD" \
            > certificate.txt

          echo "=== SIGNING CERTIFICATE ==="

          grep -E \
            "Owner:|Issuer:|SHA256:|Alias name:" \
            certificate.txt || true

          EXPECTED_CERT="953F444B65594F10FCC456A7F5443FDB9554AF46F9A5FB72BF249291C848C7E0"

          ACTUAL_CERT="$(
            grep -i "SHA256:" certificate.txt \
            | head -1 \
            | sed 's/.*SHA256:[[:space:]]*//' \
            | tr -d ':' \
            | tr '[:lower:]' '[:upper:]'
          )"

          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "ERROR: Signing certificate does not match."
            echo "Expected: $EXPECTED_CERT"
            echo "Actual:   $ACTUAL_CERT"
            exit 1
          fi

          echo "Signing certificate matches EANUXX certificate."

      - name: Sign APK
        shell: bash
        env:
          EANUXX_KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          SIGNED_APK="output/EANUXX-v0.4.0-update.apk"

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks EANUXX-release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias eanuxx \
            --ks-pass "pass:$EANUXX_KEYSTORE_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          echo "SIGNED_APK=$SIGNED_APK" >> "$GITHUB_ENV"

          echo "APK signed with EANUXX certificate."

      - name: Verify final APK
        shell: bash
        run: |
          set -u

          echo "=== APK SIGNATURE VERIFICATION ==="

          VERIFY_OUTPUT="$(
            "$BUILD_TOOLS_DIR/apksigner" verify \
              --verbose \
              --print-certs \
              "$SIGNED_APK" 2>&1
          )"

          VERIFY_STATUS=$?

          printf '%s\n' "$VERIFY_OUTPUT"

          if [ "$VERIFY_STATUS" -ne 0 ]; then
            echo "ERROR: APK signature verification failed."
            exit "$VERIFY_STATUS"
          fi

          echo
          echo "=== EXTRACT CERTIFICATE ==="

          APK_CERT="$(
            printf '%s\n' "$VERIFY_OUTPUT" \
            | grep -oE \
              'SHA-256 digest: [0-9A-Fa-f:]+' \
            | head -1 \
            | sed 's/.*: //' \
            | tr -d ':' \
            | tr '[:lower:]' '[:upper:]'
          )"

          EXPECTED_CERT="953F444B65594F10FCC456A7F5443FDB9554AF46F9A5FB72BF249291C848C7E0"

          echo "Expected:"
          echo "$EXPECTED_CERT"

          echo "APK:"
          echo "$APK_CERT"

          if [ -z "$APK_CERT" ]; then
            echo "ERROR: Could not extract APK certificate."
            exit 1
          fi

          if [ "$APK_CERT" != "$EXPECTED_CERT" ]; then
            echo "ERROR: APK certificate does not match."
            exit 1
          fi

          echo
          echo "APK certificate matches."

      - name: Verify final APK alignment
        shell: bash
        run: |
          set -euo pipefail

          "$BUILD_TOOLS_DIR/zipalign" \
            -c \
            -P 16 \
            4 \
            "$SIGNED_APK"

          echo "Final APK alignment verified."

      - name: Verify APK ZIP integrity
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "$SIGNED_APK" >/dev/null

          echo "APK ZIP integrity verified."

      - name: Verify final package and version
        shell: bash
        run: |
          set -euo pipefail

          BADGING="$(
            "$BUILD_TOOLS_DIR/aapt" dump badging "$SIGNED_APK"
          )"

          printf '%s\n' "$BADGING"

          echo "$BADGING" \
            | grep -q "package: name='com.wEANUXX_20148007'"

          echo "$BADGING" \
            | grep -q "versionCode='5'"

          echo "$BADGING" \
            | grep -q "versionName='0.4.0-professional-update'"

          echo "Package and version verified."

      - name: Check native libraries
        shell: bash
        run: |
          set -euo pipefail

          rm -rf native-check
          mkdir -p native-check

          unzip -q "$SIGNED_APK" "lib/*" -d native-check || true

          SO_COUNT="$(
            find native-check -type f -name "*.so" | wc -l
          )"

          echo "Native libraries found: $SO_COUNT"

          if [ "$SO_COUNT" -eq 0 ]; then
            echo "No native libraries found."
            exit 0
          fi

          echo "Native libraries are present."
          echo "ZIP alignment has already been verified for 16 KB compatibility."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EANUXX-v0.4.0-update
          path: output/EANUXX-v0.4.0-update.apk
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          rm -f -- EANUXX-release.p12 certificate.txt
          echo "Signing material removed."
