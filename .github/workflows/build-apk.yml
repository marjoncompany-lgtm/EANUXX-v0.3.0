name: EANUXX APK Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: eanuxx-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build EANUXX update APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # =========================================================
      # LOCATE SOURCE
      # =========================================================

      - name: Locate and validate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="EANUXX_Livestreaming_Studio_v0.3.0_FIXED_SOURCE.zip"

          if [ ! -s "$SOURCE_ZIP" ]; then
            echo "ERROR: Required source ZIP is missing or empty."
            exit 1
          fi

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

          echo "Source ZIP confirmed:"
          echo "$SOURCE_ZIP"

      # =========================================================
      # EXTRACT SOURCE
      # =========================================================

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf -- source

          mkdir -p -- source

          unzip -q "$SOURCE_ZIP" -d source

          test -f source/EANUXX/settings.gradle.kts
          test -f source/EANUXX/build.gradle.kts
          test -f source/EANUXX/app/build.gradle.kts

          echo "Source project validated."

      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # =========================================================
      # GRADLE 8.9
      # =========================================================

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================================
      # GRADLE PROJECT CHECK
      # =========================================================

      - name: Check Gradle project
        shell: bash
        working-directory: source/EANUXX
        run: |
          set -euo pipefail

          gradle --no-daemon tasks --all

          echo "Gradle project check passed."

      # =========================================================
      # BUILD RELEASE APK
      # =========================================================

      - name: Build release APK
        shell: bash
        working-directory: source/EANUXX
        run: |
          set -euo pipefail

          gradle --no-daemon clean assembleRelease

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Unsigned APK was not created."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/EANUXX-release-unsigned.apk"

          echo "Unsigned APK created:"
          ls -lh "$GITHUB_WORKSPACE/EANUXX-release-unsigned.apk"

      # =========================================================
      # FIND ANDROID BUILD TOOLS
      # =========================================================

      - name: Locate Android build tools
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS_VERSION="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' |
              sort -V |
              tail -n 1
          )"

          if [ -z "$BUILD_TOOLS_VERSION" ]; then
            echo "ERROR: Android Build Tools not found."
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"

          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

          echo "Using Android Build Tools:"
          echo "$BUILD_TOOLS_VERSION"

      # =========================================================
      # VERIFY UNSIGNED APK
      # =========================================================

      - name: Verify unsigned APK integrity
        shell: bash
        run: |
          set -euo pipefail

          unzip -t EANUXX-release-unsigned.apk >/dev/null

          echo "Unsigned APK ZIP integrity verified."

      # =========================================================
      # ALIGN APK
      # =========================================================

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Aligning APK..."

          "$BUILD_TOOLS/zipalign" -f -P 16 4 \
            EANUXX-release-unsigned.apk \
            EANUXX-release-aligned.apk

          test -s EANUXX-release-aligned.apk

          echo "Checking APK alignment..."

          "$BUILD_TOOLS/zipalign" -c -P 16 4 \
            EANUXX-release-aligned.apk

          echo "APK alignment verified."

      # =========================================================
      # RESOURCES.ARSC
      # =========================================================

      - name: Verify resources.arsc
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import sys
          import zipfile

          apk = "EANUXX-release-aligned.apk"

          try:
              with zipfile.ZipFile(apk, "r") as z:
                  info = z.getinfo("resources.arsc")

                  if info.compress_type != zipfile.ZIP_STORED:
                      raise RuntimeError(
                          "resources.arsc is compressed"
                      )

          except Exception as exc:
              print(f"ERROR: {exc}")
              sys.exit(1)

          print("resources.arsc is present and uncompressed.")
          PY

      # =========================================================
      # PACKAGE / VERSION
      # =========================================================

      - name: Verify unsigned package metadata
        shell: bash
        run: |
          set -euo pipefail

          BADGING="$(
            "$BUILD_TOOLS/aapt" \
              dump badging \
              EANUXX-release-aligned.apk
          )"

          echo "$BADGING"

          grep -Fq \
            "package: name='com.wEANUXX_20148007'" \
            <<< "$BADGING"

          grep -Fq \
            "versionCode='3'" \
            <<< "$BADGING"

          grep -Fq \
            "versionName='0.3.0-functional-update'" \
            <<< "$BADGING"

          echo "Package and version verified before signing."

      # =========================================================
      # RESTORE EXISTING EANUXX CERTIFICATE
      # =========================================================

      - name: Restore signing certificate
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.EANUXX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: EANUXX_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode > EANUXX-release.p12

          chmod 600 EANUXX-release.p12

          test -s EANUXX-release.p12

          echo "Signing keystore restored."

      # =========================================================
      # VERIFY EXISTING CERTIFICATE
      # =========================================================

      - name: Verify signing certificate
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: EANUXX_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          EXPECTED="953F444B65594F10FCC456A7F5443FDB9554AF46F9A5FB72BF249291C848C7E0"

          keytool \
            -exportcert \
            -noprompt \
            -storetype PKCS12 \
            -keystore EANUXX-release.p12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias eanuxx \
            > EANUXX-cert.der

          ACTUAL="$(
            sha256sum EANUXX-cert.der |
            awk '{print toupper($1)}'
          )"

          echo "Keystore certificate SHA-256:"
          echo "$ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Wrong signing certificate."
            exit 1
          fi

          echo "Correct EANUXX certificate confirmed."

      # =========================================================
      # SIGN APK
      # =========================================================

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          "$BUILD_TOOLS/apksigner" sign \
            --ks EANUXX-release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias eanuxx \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out EANUXX-release.apk \
            EANUXX-release-aligned.apk

          test -s EANUXX-release.apk

          echo "Signed APK created."

      # =========================================================
      # FINAL APK VERIFICATION
      # =========================================================

      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail

          APK="EANUXX-release.apk"

          EXPECTED="953F444B65594F10FCC456A7F5443FDB9554AF46F9A5FB72BF249291C848C7E0"

          echo "========================================"
          echo "APK SIGNATURE VERIFICATION"
          echo "========================================"

          # IMPORTANT:
          # Keep this command on ONE logical shell line.
          # The previous workflow had corrupted backslashes here.

          set +e

          VERIFY_OUTPUT="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" 2>&1)"

          VERIFY_STATUS=$?

          set -e

          echo "----- apksigner output -----"

          printf '%s\n' "$VERIFY_OUTPUT"

          echo "----- apksigner exit code: $VERIFY_STATUS -----"

          if [ "$VERIFY_STATUS" -ne 0 ]; then
            echo ""
            echo "ERROR: APK signature verification failed."
            echo ""
            echo "The complete apksigner diagnostic is shown above."
            exit 1
          fi

          echo "APK signature verification completed successfully."

          # =====================================================
          # V2
          # =====================================================

          if ! grep -Fq \
            "Verified using v2 scheme (APK Signature Scheme v2): true" \
            <<< "$VERIFY_OUTPUT"
          then
            echo "ERROR: V2 signature was not verified."
            exit 1
          fi

          echo "V2 signature verified."

          # =====================================================
          # V3
          # =====================================================

          if ! grep -Fq \
            "Verified using v3 scheme (APK Signature Scheme v3): true" \
            <<< "$VERIFY_OUTPUT"
          then
            echo "ERROR: V3 signature was not verified."
            exit 1
          fi

          echo "V3 signature verified."

          # =====================================================
          # CERTIFICATE
          # =====================================================

          echo "========================================"
          echo "APK CERTIFICATE VERIFICATION"
          echo "========================================"

          APK_CERT="$(
            printf '%s\n' "$VERIFY_OUTPUT" |
            python3 -c '
          import sys
          import re

          text = sys.stdin.read()

          match = re.search(
              r"certificate SHA-256 digest:\s*([0-9A-Fa-f:]+)",
              text,
              re.IGNORECASE
          )

          if not match:
              print(
                  "ERROR: Could not locate APK certificate SHA-256.",
                  file=sys.stderr
              )
              sys.exit(1)

          print(
              match.group(1)
              .replace(":", "")
              .upper()
          )
          '
          )"

          echo "Expected certificate:"
          echo "$EXPECTED"

          echo "APK certificate:"
          echo "$APK_CERT"

          if [ "$APK_CERT" != "$EXPECTED" ]; then
            echo "ERROR: Final APK certificate does not match EANUXX certificate."
            exit 1
          fi

          echo "Correct EANUXX APK certificate confirmed."

          # =====================================================
          # PACKAGE
          # =====================================================

          echo "========================================"
          echo "APK PACKAGE VERIFICATION"
          echo "========================================"

          BADGING="$(
            "$BUILD_TOOLS/aapt" \
              dump badging \
              "$APK"
          )"

          echo "$BADGING"

          grep -Fq \
            "package: name='com.wEANUXX_20148007'" \
            <<< "$BADGING"

          grep -Fq \
            "versionCode='3'" \
            <<< "$BADGING"

          grep -Fq \
            "versionName='0.3.0-functional-update'" \
            <<< "$BADGING"

          echo "Package verified."
          echo "Version Code 3 verified."
          echo "Version Name 0.3.0-functional-update verified."

          # =====================================================
          # ZIP INTEGRITY
          # =====================================================

          echo "========================================"
          echo "APK ZIP VERIFICATION"
          echo "========================================"

          unzip -t "$APK" >/dev/null

          echo "APK ZIP integrity verified."

          # =====================================================
          # FINAL resources.arsc
          # =====================================================

          echo "========================================"
          echo "FINAL resources.arsc VERIFICATION"
          echo "========================================"

          python3 - <<'PY'
          import sys
          import zipfile

          apk = "EANUXX-release.apk"

          try:
              with zipfile.ZipFile(apk, "r") as z:
                  info = z.getinfo("resources.arsc")

                  if info.compress_type != zipfile.ZIP_STORED:
                      raise RuntimeError(
                          "resources.arsc is compressed"
                      )

          except Exception as exc:
              print(f"ERROR: {exc}")
              sys.exit(1)

          print("Final resources.arsc check passed.")
          PY

          # =====================================================
          # SUCCESS
          # =====================================================

          echo ""
          echo "========================================"
          echo "EANUXX UPDATE APK VERIFIED SUCCESSFULLY"
          echo "========================================"

          echo "Package: com.wEANUXX_20148007"
          echo "Version Code: 3"
          echo "Version Name: 0.3.0-functional-update"
          echo "V2: VERIFIED"
          echo "V3: VERIFIED"
          echo "Certificate: VERIFIED"
          echo "ZIP: VERIFIED"
          echo "resources.arsc: VERIFIED"

          echo "========================================"

      # =========================================================
      # UPLOAD APK
      # =========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EANUXX-v0.3.0-update-APK
          path: EANUXX-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # =========================================================
      # CLEANUP
      # =========================================================

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          set -eo pipefail

          rm -f -- \
            EANUXX-release.p12 \
            EANUXX-cert.der \
            EANUXX-release-unsigned.apk \
            EANUXX-release-aligned.apk

          echo "Signing material and temporary APKs removed."      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- source
          mkdir -p -- source
          unzip -q "$SOURCE_ZIP" -d source
          test -f source/EANUXX/settings.gradle.kts
          test -f source/EANUXX/build.gradle.kts
          test -f source/EANUXX/app/build.gradle.kts
          echo "Source project validated."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Gradle project
        shell: bash
        working-directory: source/EANUXX
        run: |
          set -euo pipefail
          gradle --no-daemon tasks --all
          echo "Gradle project check passed."

      - name: Build release APK
        shell: bash
        working-directory: source/EANUXX
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/EANUXX-release-unsigned.apk"
          echo "Unsigned APK created:"
          ls -lh "$GITHUB_WORKSPACE/EANUXX-release-unsigned.apk"

      - name: Locate Android build tools
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS_VERSION="$( find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1 )"
          test -n "$BUILD_TOOLS_VERSION"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          echo "Using Android Build Tools $BUILD_TOOLS_VERSION"

      - name: Verify unsigned APK integrity
        shell: bash
        run: |
          set -euo pipefail
          unzip -t EANUXX-release-unsigned.apk >/dev/null
          echo "Unsigned APK ZIP integrity verified."

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail
          echo "Aligning APK for 4-byte ZIP alignment and 16 KB native-library page alignment..."
          "$BUILD_TOOLS/zipalign" \
            -f \
            -P 16 \
            4 \
            EANUXX-release-unsigned.apk \
            EANUXX-release-aligned.apk
          test -s EANUXX-release-aligned.apk
          "$BUILD_TOOLS/zipalign" \
            -c \
            -P 16 \
            4 \
            EANUXX-release-aligned.apk
          echo "APK alignment verified."

      - name: Verify resources.arsc
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          import zipfile

          apk = "EANUXX-release-aligned.apk"

          try:
              with zipfile.ZipFile(apk, "r") as z:
                  info = z.getinfo("resources.arsc")
                  if info.compress_type != zipfile.ZIP_STORED:
                      raise RuntimeError("resources.arsc is compressed")
          except Exception as exc:
              print(f"ERROR: {exc}")
              sys.exit(1)

          print("resources.arsc is present and uncompressed.")
          PY

      - name: Verify unsigned package metadata
        shell: bash
        run: |
          set -euo pipefail
          BADGING="$("$BUILD_TOOLS/aapt" dump badging EANUXX-release-aligned.apk)"
          echo "$BADGING"
          grep -Fq "package: name='com.wEANUXX_20148007'" <<< "$BADGING"
          grep -Fq "versionCode='3'" <<< "$BADGING"
          grep -Fq "versionName='0.3.0-functional-update'" <<< "$BADGING"
          echo "Package and version verified before signing."

      - name: Restore signing certificate
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.EANUXX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" || {
            echo "ERROR: EANUXX_KEYSTORE_BASE64 is missing."
            exit 1
          }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > EANUXX-release.p12
          chmod 600 EANUXX-release.p12
          test -s EANUXX-release.p12
          echo "Signing keystore restored."

      - name: Verify signing certificate
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_PASSWORD:-}" || {
            echo "ERROR: EANUXX_KEYSTORE_PASSWORD is missing."
            exit 1
          }

          EXPECTED="953F444B65594F10FCC456A7F5443FDB9554AF46F9A5FB72BF249291C848C7E0"

          keytool -exportcert -noprompt -storetype PKCS12 \
            -keystore EANUXX-release.p12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias eanuxx > EANUXX-cert.der

          ACTUAL="$(sha256sum EANUXX-cert.der | awk '{print toupper($1)}')"

          echo "Keystore certificate SHA-256: $ACTUAL"

          test "$ACTUAL" = "$EXPECTED" || {
            echo "ERROR: Wrong signing certificate."
            exit 1
          }

          echo "Correct EANUXX certificate confirmed."

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          "$BUILD_TOOLS/apksigner" sign \
            --ks EANUXX-release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias eanuxx \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out EANUXX-release.apk \
            EANUXX-release-aligned.apk

          test -s EANUXX-release.apk
          echo "Signed APK created."

      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail

          APK="EANUXX-release.apk"
          EXPECTED="953F444B65594F10FCC456A7F5443FDB9554AF46F9A5FB72BF249291C848C7E0"

          echo "=== APK SIGNATURE VERIFICATION ==="

          VERIFY_OUTPUT="$( "$BUILD_TOOLS/apksigner" \ verify \ --verbose \ --print-certs \ "$APK" 2>&1 )"

          echo "$VERIFY_OUTPUT"

          grep -Fq \
            "Verified using v2 scheme (APK Signature Scheme v2): true" \
            <<< "$VERIFY_OUTPUT"

          grep -Fq \
            "Verified using v3 scheme (APK Signature Scheme v3): true" \
            <<< "$VERIFY_OUTPUT"

          echo "V2 signature verified."
          echo "V3 signature verified."

          echo "=== APK CERTIFICATE VERIFICATION ==="

          APK_CERT="$( printf '%s\n' "$VERIFY_OUTPUT" | python3 -c ' import sys import re text = sys.stdin.read() match = re.search( r"certificate SHA-256 digest:\s*([0-9A-Fa-f:]+)", text, re.IGNORECASE ) if not match: sys.exit(1) print(match.group(1).replace(":", "").upper()) ' )"

          echo "APK certificate SHA-256: $APK_CERT"

          test "$APK_CERT" = "$EXPECTED" || {
            echo "ERROR: Final APK certificate does not match EANUXX certificate."
            exit 1
          }

          echo "Correct EANUXX APK certificate confirmed."

          echo "=== APK PACKAGE VERIFICATION ==="

          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"

          echo "$BADGING"

          grep -Fq \
            "package: name='com.wEANUXX_20148007'" \
            <<< "$BADGING"

          grep -Fq \
            "versionCode='3'" \
            <<< "$BADGING"

          grep -Fq \
            "versionName='0.3.0-functional-update'" \
            <<< "$BADGING"

          echo "Package and version verified."

          echo "=== APK ZIP VERIFICATION ==="

          unzip -t "$APK" >/dev/null

          echo "APK ZIP integrity verified."

          echo "=== FINAL resources.arsc VERIFICATION ==="

          python3 - <<'PY'
          import sys
          import zipfile

          apk = "EANUXX-release.apk"

          try:
              with zipfile.ZipFile(apk, "r") as z:
                  info = z.getinfo("resources.arsc")

                  if info.compress_type != zipfile.ZIP_STORED:
                      raise RuntimeError("resources.arsc is compressed")

          except Exception as exc:
              print(f"ERROR: {exc}")
              sys.exit(1)

          print("Final resources.arsc check passed.")
          PY

          echo "========================================"
          echo "EANUXX UPDATE APK VERIFIED SUCCESSFULLY"
          echo "========================================"
          echo "Package: com.wEANUXX_20148007"
          echo "Version Code: 3"
          echo "Version Name: 0.3.0-functional-update"
          echo "V2: VERIFIED"
          echo "V3: VERIFIED"
          echo "Certificate: VERIFIED"
          echo "ZIP: VERIFIED"
          echo "resources.arsc: VERIFIED"
          echo "========================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EANUXX-v0.3.0-update-APK
          path: EANUXX-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          set -eo pipefail

          rm -f -- \
            EANUXX-release.p12 \
            EANUXX-cert.der \
            EANUXX-release-unsigned.apk \
            EANUXX-release-aligned.apk

          echo "Signing material and temporary APKs removed."
