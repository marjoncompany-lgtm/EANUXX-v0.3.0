name: Build EANUXX Update APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Sign EANUXX APK
    runs-on: ubuntu-latest

    env:
      PACKAGE_NAME: com.wEANUXX_20148007
      VERSION_CODE: "4"
      VERSION_NAME: 0.3.1-functional-update
      KEY_ALIAS: eanuxx
      EXPECTED_SHA256: 953F444B65594F10FCC456A7F5443FDB9554AF46F9A5FB72BF249291C848C7E0

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate source ZIP
        shell: bash
        run: |
          set -e

          SOURCE_ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name "*.zip" -print -quit)

          if [ -z "$SOURCE_ZIP" ]; then
            echo "ERROR: No source ZIP found."
            exit 1
          fi

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

          echo "Source ZIP found:"
          ls -lh "$SOURCE_ZIP"

      - name: Extract source
        shell: bash
        run: |
          set -e

          rm -rf build-source
          mkdir -p build-source

          echo "Extracting source ZIP..."
          unzip -q "$SOURCE_ZIP" -d build-source

          PROJECT_DIR="build-source/EANUXX"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found."
            echo "Extracted files:"
            find build-source -maxdepth 5 -type f -print
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "ERROR: build.gradle.kts not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Update APK version
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path("app/build.gradle.kts")

          text = file.read_text()

          text, count_code = re.subn(
              r'versionCode\s*=\s*\d+',
              'versionCode = 4',
              text,
              count=1
          )

          text, count_name = re.subn(
              r'versionName\s*=\s*"[^"]*"',
              'versionName = "0.3.1-functional-update"',
              text,
              count=1
          )

          if count_code != 1:
              raise SystemExit("ERROR: versionCode could not be updated.")

          if count_name != 1:
              raise SystemExit("ERROR: versionName could not be updated.")

          file.write_text(text)

          print("versionCode = 4")
          print('versionName = "0.3.1-functional-update"')
          PY

      - name: Build release APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "Building release APK..."

          gradle clean assembleRelease --no-daemon --stacktrace

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$APK" ]; then
            APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" -print -quit)
          fi

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "ERROR: Release APK was not produced."
            find app/build/outputs -type f -print 2>/dev/null || true
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/EANUXX-unsigned.apk"

          echo "Unsigned APK created:"
          ls -lh "$GITHUB_WORKSPACE/EANUXX-unsigned.apk"

      - name: Locate Android Build Tools
        shell: bash
        run: |
          set -e

          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -print | sort -V | tail -n 1)

          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "ERROR: Android Build Tools not found."
            exit 1
          fi

          if [ ! -x "$BUILD_TOOLS_DIR/zipalign" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          if [ ! -x "$BUILD_TOOLS_DIR/apksigner" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          if [ ! -x "$BUILD_TOOLS_DIR/aapt2" ]; then
            echo "ERROR: aapt2 not found."
            exit 1
          fi

          echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$BUILD_TOOLS_DIR"

      - name: Verify unsigned APK
        shell: bash
        run: |
          set -e

          unzip -t EANUXX-unsigned.apk >/dev/null

          echo "Unsigned APK integrity verified."

      - name: Align APK
        shell: bash
        run: |
          set -e

          echo "Aligning APK..."

          "$BUILD_TOOLS_DIR/zipalign" \
            -f \
            -p \
            4 \
            EANUXX-unsigned.apk \
            EANUXX-aligned.apk

          echo "Checking alignment..."

          "$BUILD_TOOLS_DIR/zipalign" \
            -c \
            -p \
            4 \
            EANUXX-aligned.apk

          echo "APK alignment verified."

      - name: Verify resources.arsc
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import zipfile

          apk = "EANUXX-aligned.apk"

          with zipfile.ZipFile(apk, "r") as z:
              info = z.getinfo("resources.arsc")

              if info.compress_type != zipfile.ZIP_STORED:
                  raise SystemExit(
                      "ERROR: resources.arsc is compressed."
                  )

          print("resources.arsc is present and uncompressed.")
          PY

      - name: Verify package and version
        shell: bash
        run: |
          set -e

          BADGING=$(
            "$BUILD_TOOLS_DIR/aapt2" \
              dump badging \
              EANUXX-aligned.apk
          )

          echo "$BADGING"

          echo "$BADGING" | grep -F \
            "package: name='$PACKAGE_NAME'" >/dev/null

          echo "$BADGING" | grep -F \
            "versionCode='4'" >/dev/null

          echo "$BADGING" | grep -F \
            "versionName='0.3.1-functional-update'" >/dev/null

          echo "Package verified."
          echo "Version 4 verified."

      - name: Restore signing certificate
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.EANUXX_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: EANUXX_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | \
            base64 --decode > EANUXX-release.p12

          chmod 600 EANUXX-release.p12

          if [ ! -s EANUXX-release.p12 ]; then
            echo "ERROR: Keystore is empty."
            exit 1
          fi

          echo "Signing certificate restored."

      - name: Verify signing certificate
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        run: |
          set -e

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: EANUXX_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          keytool \
            -list \
            -v \
            -storetype PKCS12 \
            -keystore EANUXX-release.p12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" > certificate.txt

          ACTUAL_CERT=$(
            python3 - <<'PY'
          import re

          text = open(
              "certificate.txt",
              encoding="utf-8"
          ).read()

          match = re.search(
              r'SHA256:\s*([0-9A-Fa-f:]+)',
              text
          )

          if not match:
              raise SystemExit(
                  "ERROR: Certificate SHA256 not found."
              )

          print(
              match.group(1)
              .replace(":", "")
              .upper()
          )
          PY
          )

          echo "Expected:"
          echo "$EXPECTED_SHA256"

          echo "Actual:"
          echo "$ACTUAL_CERT"

          if [ "$ACTUAL_CERT" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: Wrong EANUXX certificate."
            exit 1
          fi

          echo "Correct EANUXX certificate confirmed."

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        run: |
          set -e

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: Keystore password is missing."
            exit 1
          fi

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks EANUXX-release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out EANUXX-release.apk \
            EANUXX-aligned.apk

          if [ ! -s EANUXX-release.apk ]; then
            echo "ERROR: Signed APK was not created."
            exit 1
          fi

          echo "APK signed successfully."

      - name: Verify final APK
        shell: bash
        run: |
          set -e

          echo "Verifying final APK..."

          "$BUILD_TOOLS_DIR/apksigner" \
            verify \
            --verbose \
            --print-certs \
            EANUXX-release.apk

          echo "APK signature verification passed."

          CERT=$(
            "$BUILD_TOOLS_DIR/apksigner" \
              verify \
              --print-certs \
              EANUXX-release.apk 2>&1 |
            python3 -c '
          import re
          import sys

          text = sys.stdin.read()

          match = re.search(
              r"certificate SHA-256 digest:\s*([0-9A-Fa-f:]+)",
              text
          )

          if not match:
              raise SystemExit(1)

          print(
              match.group(1)
              .replace(":", "")
              .upper()
          )
          '
          )

          echo "Expected certificate:"
          echo "$EXPECTED_SHA256"

          echo "APK certificate:"
          echo "$CERT"

          if [ "$CERT" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: APK certificate mismatch."
            exit 1
          fi

          "$BUILD_TOOLS_DIR/zipalign" \
            -c \
            -p \
            4 \
            EANUXX-release.apk

          unzip -t EANUXX-release.apk >/dev/null

          echo "========================================"
          echo "EANUXX APK VERIFIED SUCCESSFULLY"
          echo "========================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EANUXX-v0.3.1-update
          path: EANUXX-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f -- \
            EANUXX-release.p12 \
            certificate.txt

          echo "Signing material removed."
