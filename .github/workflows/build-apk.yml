name: Build EANUXX update APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build, sign and verify EANUXX APK
    runs-on: ubuntu-latest

    env:
      PACKAGE_NAME: com.wEANUXX_20148007
      VERSION_CODE: "4"
      VERSION_NAME: 0.3.1-functional-update
      KEY_ALIAS: eanuxx
      EXPECTED_SHA256: 953F444B65594F10FCC456A7F5443FDB9554AF46F9A5FB72BF249291C848C7E0

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' -print -quit)"

          if [ -z "$SOURCE_ZIP" ]; then
            echo "ERROR: No source ZIP found."
            exit 1
          fi

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

          echo "Source ZIP:"
          ls -lh "$SOURCE_ZIP"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-source
          mkdir -p build-source

          unzip -q "$SOURCE_ZIP" -d build-source

          SETTINGS_FILE="$(find build-source -type f -name 'settings.gradle' -o -name 'settings.gradle.kts' -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            find build-source -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project:"
          echo "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Update APK version
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("app/build.gradle"),
              Path("app/build.gradle.kts")
          ]

          gradle_file = next((p for p in candidates if p.exists()), None)

          if gradle_file is None:
              raise SystemExit("ERROR: app/build.gradle(.kts) not found.")

          text = gradle_file.read_text()

          original = text

          text = re.sub(
              r'(versionCode\s*[=:]\s*)\d+',
              r'\g<1>4',
              text,
              count=1
          )

          text = re.sub(
              r'(versionName\s*[=:]\s*)["\'][^"\']*["\']',
              r'\g<1>"0.3.1-functional-update"',
              text,
              count=1
          )

          if text == original:
              raise SystemExit(
                  "ERROR: Could not update versionCode/versionName."
              )

          gradle_file.write_text(text)

          print("Updated:")
          print(gradle_file)
          print("versionCode = 4")
          print("versionName = 0.3.1-functional-update")
          PY

      - name: Build release APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle clean assembleRelease --no-daemon --stacktrace

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$APK" ]; then
            APK="$(find app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print -quit)"
          fi

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "ERROR: Release APK was not produced."

            find app/build/outputs \
              -type f \
              2>/dev/null \
              | sort || true

            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/EANUXX-unsigned.apk"

          echo "Unsigned APK created:"
          ls -lh "$GITHUB_WORKSPACE/EANUXX-unsigned.apk"

      - name: Locate Android build tools
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS_DIR="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print |
            sort -V |
            tail -n 1
          )"

          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "ERROR: Android Build Tools not found."
            exit 1
          fi

          for TOOL in zipalign apksigner aapt2; do
            if [ ! -x "$BUILD_TOOLS_DIR/$TOOL" ]; then
              echo "ERROR: $TOOL not found."
              exit 1
            fi
          done

          echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> "$GITHUB_ENV"

          echo "Android Build Tools:"
          echo "$BUILD_TOOLS_DIR"

      - name: Verify unsigned APK
        shell: bash
        run: |
          set -euo pipefail

          unzip -t EANUXX-unsigned.apk >/dev/null

          echo "Unsigned APK ZIP integrity OK."

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail

          "$BUILD_TOOLS_DIR/zipalign" \
            -f \
            -p \
            4 \
            EANUXX-unsigned.apk \
            EANUXX-aligned.apk

          "$BUILD_TOOLS_DIR/zipalign" \
            -c \
            -p \
            4 \
            EANUXX-aligned.apk

          echo "APK alignment verified."

      - name: Verify resources.arsc
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import zipfile

          apk = "EANUXX-aligned.apk"

          with zipfile.ZipFile(apk, "r") as z:
              info = z.getinfo("resources.arsc")

              if info.compress_type != zipfile.ZIP_STORED:
                  raise SystemExit(
                      "ERROR: resources.arsc is compressed."
                  )

          print("resources.arsc is present and uncompressed.")
          PY

      - name: Verify package and version
        shell: bash
        run: |
          set -euo pipefail

          BADGING="$(
            "$BUILD_TOOLS_DIR/aapt2" \
              dump badging \
              EANUXX-aligned.apk
          )"

          echo "$BADGING"

          if ! grep -Fq \
            "package: name='$PACKAGE_NAME'" \
            <<< "$BADGING"
          then
            echo "ERROR: Package name mismatch."
            exit 1
          fi

          if ! grep -Fq \
            "versionCode='4'" \
            <<< "$BADGING"
          then
            echo "ERROR: versionCode is not 4."
            exit 1
          fi

          if ! grep -Fq \
            "versionName='0.3.1-functional-update'" \
            <<< "$BADGING"
          then
            echo "ERROR: versionName mismatch."
            exit 1
          fi

          echo "Package verified."
          echo "Version code 4 verified."
          echo "Version name verified."

      - name: Restore EANUXX signing certificate
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.EANUXX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: EANUXX_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode > EANUXX-release.p12

          chmod 600 EANUXX-release.p12

          if [ ! -s EANUXX-release.p12 ]; then
            echo "ERROR: Keystore is empty."
            exit 1
          fi

          echo "EANUXX signing certificate restored."

      - name: Verify EANUXX certificate
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: EANUXX_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          keytool \
            -list \
            -v \
            -storetype PKCS12 \
            -keystore EANUXX-release.p12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" > certificate.txt

          ACTUAL_CERT="$(
            python3 - <<'PY'
          import re

          text = open(
              "certificate.txt",
              encoding="utf-8"
          ).read()

          match = re.search(
              r'SHA256:\s*([0-9A-Fa-f:]+)',
              text
          )

          if not match:
              raise SystemExit(
                  "ERROR: SHA256 certificate fingerprint not found."
              )

          print(
              match.group(1)
              .replace(":", "")
              .upper()
          )
          PY
          )"

          echo "Expected certificate:"
          echo "$EXPECTED_SHA256"

          echo "Keystore certificate:"
          echo "$ACTUAL_CERT"

          if [ "$ACTUAL_CERT" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: Wrong signing certificate."
            exit 1
          fi

          echo "Correct EANUXX certificate confirmed."

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks EANUXX-release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3
