name: EANUXX APK Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build EANUXX update APK
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. FIND SOURCE ZIP
      # ---------------------------------------------------------
      - name: Locate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No source ZIP found in repository root."
            exit 1
          fi

          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Found source ZIP: $ZIP"

      # ---------------------------------------------------------
      # 3. EXTRACT SOURCE
      # ---------------------------------------------------------
      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          unzip -q "$SOURCE_ZIP" -d source

          echo "Source extracted."

          find source -maxdepth 3 \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print

      # ---------------------------------------------------------
      # 4. FIND AND SET ANDROID PROJECT
      # ---------------------------------------------------------
      - name: Check Gradle project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/source" \
            -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit \
            | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project:"
          echo "$PROJECT_DIR"

          echo "Project files:"
          ls -la "$PROJECT_DIR"

      # ---------------------------------------------------------
      # 5. JAVA 17
      # ---------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------
      # 6. GRADLE 8.9
      # ---------------------------------------------------------
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ---------------------------------------------------------
      # 7. BUILD RELEASE APK
      # ---------------------------------------------------------
      - name: Build release APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Building EANUXX release APK..."

          gradle --no-daemon clean assembleRelease

          echo "Build completed."

          APK="$(find . \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not created."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/EANUXX-release-unsigned.apk"

          echo "Unsigned APK:"
          ls -lh "$GITHUB_WORKSPACE/EANUXX-release-unsigned.apk"

      # ---------------------------------------------------------
      # 8. LOCATE ANDROID BUILD TOOLS
      # ---------------------------------------------------------
      - name: Locate Android build tools
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS_VERSION="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$BUILD_TOOLS_VERSION" ]; then
            echo "ERROR: Android build tools not found."
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

          echo "Using Android Build Tools: $BUILD_TOOLS_VERSION"

          "$BUILD_TOOLS/zipalign" -version
          "$BUILD_TOOLS/apksigner" --version

      # ---------------------------------------------------------
      # 9. ALIGN APK
      # ---------------------------------------------------------
      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail

          "$BUILD_TOOLS/zipalign" \
            -f \
            -p \
            4 \
            EANUXX-release-unsigned.apk \
            EANUXX-release-aligned.apk

          echo "APK alignment completed."

          "$BUILD_TOOLS/zipalign" \
            -c \
            -P 4 \
            4 \
            EANUXX-release-aligned.apk

          echo "zipalign verification successful."

      # ---------------------------------------------------------
      # 10. VERIFY resources.arsc
      # ---------------------------------------------------------
      - name: Verify resources.arsc
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import zipfile
          import sys

          apk = "EANUXX-release-aligned.apk"

          with zipfile.ZipFile(apk, "r") as z:
              info = z.getinfo("resources.arsc")

              if info.compress_type != zipfile.ZIP_STORED:
                  print("ERROR: resources.arsc is compressed.")
                  sys.exit(1)

              print("resources.arsc is uncompressed.")
          PY

          echo "resources.arsc verification successful."

      # ---------------------------------------------------------
      # 11. RESTORE ORIGINAL EANUXX CERTIFICATE
      # ---------------------------------------------------------
      - name: Restore signing certificate
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.EANUXX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: EANUXX_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > EANUXX-release.p12

          chmod 600 EANUXX-release.p12

          echo "Signing certificate restored."

      # ---------------------------------------------------------
      # 12. VERIFY CERTIFICATE BEFORE SIGNING
      # ---------------------------------------------------------
      - name: Verify signing certificate
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          keytool \
            -list \
            -v \
            -keystore EANUXX-release.p12 \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias eanuxx

          echo "Signing certificate verified."

      # ---------------------------------------------------------
      # 13. SIGN APK
      # ---------------------------------------------------------
      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          "$BUILD_TOOLS/apksigner" sign \
            --ks EANUXX-release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias eanuxx \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out EANUXX-release.apk \
            EANUXX-release-aligned.apk

          echo "APK signing completed."

          ls -lh EANUXX-release.apk

      # ---------------------------------------------------------
      # 14. VERIFY FINAL APK
      # ---------------------------------------------------------
      - name: Verify final APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          APK="EANUXX-release.apk"

          echo "========================================"
          echo "VERIFYING FINAL EANUXX APK"
          echo "========================================"

          # APK signature verification
          VERIFY_OUTPUT="$(
            "$BUILD_TOOLS/apksigner" verify \
              --verbose \
              --print-certs \
              "$APK" 2>&1
          )"

          echo "$VERIFY_OUTPUT"

          echo "$VERIFY_OUTPUT" \
            | grep -F "Verified using v2 scheme (APK Signature Scheme v2): true"

          echo "$VERIFY_OUTPUT" \
            | grep -F "Verified using v3 scheme (APK Signature Scheme v3): true"

          echo "V2 and V3 signatures confirmed."

          # -----------------------------------------------------
          # PACKAGE NAME
          # -----------------------------------------------------

          echo "========================================"
          echo "VERIFYING PACKAGE"
          echo "========================================"

          BADGING="$(
            "$ANDROID_HOME/build-tools/$(
              basename "$BUILD_TOOLS"
            )/aapt" dump badging "$APK"
          )"

          echo "$BADGING" | grep -F \
            "package: name='com.wEANUXX_20148007'"

          echo "Package name confirmed."

          # -----------------------------------------------------
          # VERSION
          # -----------------------------------------------------

          echo "========================================"
          echo "VERIFYING VERSION"
          echo "========================================"

          echo "$BADGING" | grep -F \
            "versionCode='3'"

          echo "$BADGING" | grep -F \
            "versionName='0.3.0-functional-update'"

          echo "Version confirmed."

          # -----------------------------------------------------
          # CERTIFICATE FINGERPRINT
          # -----------------------------------------------------

          echo "========================================"
          echo "VERIFYING CERTIFICATE"
          echo "========================================"

          EXPECTED_CERT="953F444B65594F10FCC456A7F5443FDB9554AF46F9A5FB72BF249291C848C7E0"

          NORMALIZED_OUTPUT="$(
            echo "$VERIFY_OUTPUT" \
              | tr '[:lower:]' '[:upper:]' \
              | tr -d ':'
          )"

          echo "Expected certificate:"
          echo "$EXPECTED_CERT"

          echo "Checking APK certificate..."

          echo "$NORMALIZED_OUTPUT" \
            | grep -F "$EXPECTED_CERT"

          echo "Correct EANUXX certificate confirmed."

          # -----------------------------------------------------
          # ZIP INTEGRITY
          # -----------------------------------------------------

          echo "========================================"
          echo "VERIFYING ZIP INTEGRITY"
          echo "========================================"

          unzip -t "$APK"

          echo "ZIP integrity confirmed."

          # -----------------------------------------------------
          # FINAL SUCCESS
          # -----------------------------------------------------

          echo "========================================"
          echo "EANUXX APK VERIFICATION SUCCESSFUL"
          echo "========================================"

          echo "Package: com.wEANUXX_20148007"
          echo "Version Code: 3"
          echo "Version Name: 0.3.0-functional-update"
          echo "V2 Signature: VERIFIED"
          echo "V3 Signature: VERIFIED"
          echo "Certificate: VERIFIED"
          echo "ZIP Integrity: VERIFIED"
          echo "========================================"

      # ---------------------------------------------------------
      # 15. UPLOAD APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EANUXX-v0.3.0-update-APK
          path: EANUXX-release.apk
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------
      # 16. REMOVE SIGNING MATERIAL
      # ---------------------------------------------------------
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          rm -f EANUXX-release.p12

          echo "Signing material removed."
