name: EANUXX APK Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Least-privilege repository access.
permissions:
  contents: read

# Prevent overlapping builds from racing with each other.
concurrency:
  group: eanuxx-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build EANUXX update APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # =========================================================
      # 2. VERIFY EXACT SOURCE PACKAGE
      # =========================================================
      - name: Locate and validate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="EANUXX_Livestreaming_Studio_v0.3.0_FIXED_SOURCE.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Required source ZIP is missing:"
            echo "$SOURCE_ZIP"
            exit 1
          fi

          if [ ! -s "$SOURCE_ZIP" ]; then
            echo "ERROR: Source ZIP is empty."
            exit 1
          fi

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

          echo "Source package confirmed:"
          ls -lh "$SOURCE_ZIP"

      # =========================================================
      # 3. EXTRACT SOURCE
      # =========================================================
      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf -- source
          mkdir -p -- source

          unzip -q "$SOURCE_ZIP" -d source

          test -f source/EANUXX/settings.gradle.kts
          test -f source/EANUXX/build.gradle.kts
          test -f source/EANUXX/app/build.gradle.kts

          echo "Source project validated successfully."

      # =========================================================
      # 4. JAVA 17
      # =========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # =========================================================
      # 5. GRADLE 8.9
      # =========================================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================================
      # 6. VERIFY GRADLE PROJECT
      # =========================================================
      - name: Check Gradle project
        shell: bash
        working-directory: source/EANUXX
        run: |
          set -euo pipefail

          gradle --no-daemon tasks --all

          echo "Gradle project check passed."

      # =========================================================
      # 7. BUILD RELEASE APK
      # =========================================================
      - name: Build release APK
        shell: bash
        working-directory: source/EANUXX
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BUILDING EANUXX RELEASE APK"
          echo "========================================"

          gradle --no-daemon clean assembleRelease

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -f "$APK"
          test -s "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/EANUXX-release-unsigned.apk"

          echo "Unsigned APK created:"
          ls -lh "$GITHUB_WORKSPACE/EANUXX-release-unsigned.apk"

      # =========================================================
      # 8. LOCATE ANDROID BUILD TOOLS
      # =========================================================
      - name: Locate Android build tools
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS_VERSION="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$BUILD_TOOLS_VERSION" ]; then
            echo "ERROR: Android Build Tools not found."
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"

          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

          echo "Android Build Tools:"
          echo "$BUILD_TOOLS_VERSION"

          echo "zipalign:"
          "$BUILD_TOOLS/zipalign" 2>&1 | head -n 2 || true

          echo "apksigner:"
          "$BUILD_TOOLS/apksigner" --version

          echo "Android Build Tools located successfully."

      # =========================================================
      # 9. PRE-ALIGNMENT APK INTEGRITY
      # =========================================================
      - name: Verify unsigned APK integrity
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking unsigned APK ZIP integrity..."

          unzip -t EANUXX-release-unsigned.apk >/dev/null

          echo "Unsigned APK integrity verified."

      # =========================================================
      # 10. ALIGN APK
      # =========================================================
      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "ALIGNING APK"
          echo "========================================"

          "$BUILD_TOOLS/zipalign" \
            -f \
            -p \
            4 \
            EANUXX-release-unsigned.apk \
            EANUXX-release-aligned.apk

          test -s EANUXX-release-aligned.apk

          echo "4-byte APK alignment completed."

          # Page-align uncompressed native libraries for
          # 16 KB page-size compatibility while retaining
          # standard 4-byte ZIP alignment.
          "$BUILD_TOOLS/zipalign" \
            -f \
            -P 16 \
            4 \
            EANUXX-release-aligned.apk \
            EANUXX-release-aligned-16k.apk

          mv -f EANUXX-release-aligned-16k.apk \
                EANUXX-release-aligned.apk

          test -s EANUXX-release-aligned.apk

          echo "16 KB native-library page alignment completed."

          echo "Verifying alignment..."

          "$BUILD_TOOLS/zipalign" \
            -c \
            -P 16 \
            4 \
            EANUXX-release-aligned.apk

          echo "APK alignment verification successful."

      # =========================================================
      # 11. VERIFY resources.arsc
      # =========================================================
      - name: Verify resources.arsc
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import sys
          import zipfile

          apk = "EANUXX-release-aligned.apk"

          try:
              with zipfile.ZipFile(apk, "r") as z:
                  info = z.getinfo("resources.arsc")

                  if info.compress_type != zipfile.ZIP_STORED:
                      print("ERROR: resources.arsc is compressed.")
                      sys.exit(1)

                  print("resources.arsc is uncompressed.")
          except Exception as exc:
              print(f"ERROR: Unable to inspect APK: {exc}")
              sys.exit(1)

          print("resources.arsc verification successful.")
          PY

      # =========================================================
      # 12. VERIFY PACKAGE BEFORE SIGNING
      # =========================================================
      - name: Verify unsigned package metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING UNSIGNED PACKAGE"
          echo "========================================"

          BADGING="$(
            "$BUILD_TOOLS/aapt" \
              dump badging \
              EANUXX-release-aligned.apk
          )"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -F \
            "package: name='com.wEANUXX_20148007'"

          echo "$BADGING" \
            | grep -F \
            "versionCode='3'"

          echo "$BADGING" \
            | grep -F \
            "versionName='0.3.0-functional-update'"

          echo "Unsigned package metadata verified."

      # =========================================================
      # 13. RESTORE SIGNING KEYSTORE
      # =========================================================
      - name: Restore signing certificate
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.EANUXX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: EANUXX_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > EANUXX-release.p12

          chmod 600 EANUXX-release.p12

          test -s EANUXX-release.p12

          echo "Signing keystore restored."

      # =========================================================
      # 14. VERIFY SIGNING KEYSTORE
      # =========================================================
      - name: Verify signing certificate
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: EANUXX_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          EXPECTED_CERT="953F444B65594F10FCC456A7F5443FDB9554AF46F9A5FB72BF249291C848C7E0"

          KEYSTORE_CERT="$(
            keytool \
              -list \
              -v \
              -storetype PKCS12 \
              -keystore EANUXX-release.p12 \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias eanuxx \
              | awk -F': ' '
                  /SHA256:/{print $2; exit}
                ' \
              | tr -d ':' \
              | tr -d '[:space:]' \
              | tr '[:lower:]' '[:upper:]'
          )"

          echo "Keystore certificate:"
          echo "$KEYSTORE_CERT"

          if [ "$KEYSTORE_CERT" != "$EXPECTED_CERT" ]; then
            echo "ERROR: Signing certificate does not match EANUXX certificate."
            exit 1
          fi

          echo "Correct EANUXX certificate confirmed."

      # =========================================================
      # 15. SIGN APK
      # =========================================================
      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SIGNING EANUXX APK"
          echo "========================================"

          "$BUILD_TOOLS/apksigner" sign \
            --ks EANUXX-release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias eanuxx \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out EANUXX-release.apk \
            EANUXX-release-aligned.apk

          test -s EANUXX-release.apk

          echo "Signed APK created:"
          ls -lh EANUXX-release.apk

      # =========================================================
      # 16. VERIFY FINAL APK
      # =========================================================
      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail

          APK="EANUXX-release.apk"

          echo "========================================"
          echo "VERIFYING FINAL EANUXX APK"
          echo "========================================"

          # -----------------------------------------------------
          # SIGNATURE
          # -----------------------------------------------------

          VERIFY_OUTPUT="$(
            "$BUILD_TOOLS/apksigner" \
              verify \
              --verbose \
              --print-certs \
              "$APK" 2>&1
          )"

          echo "$VERIFY_OUTPUT"

          if ! echo "$VERIFY_OUTPUT" \
            | grep -Fq \
            "Verified using v2 scheme (APK Signature Scheme v2): true"
          then
            echo "ERROR: V2 signature verification failed."
            exit 1
          fi

          if ! echo "$VERIFY_OUTPUT" \
            | grep -Fq \
            "Verified using v3 scheme (APK Signature Scheme v3): true"
          then
            echo "ERROR: V3 signature verification failed."
            exit 1
          fi

          echo "V2 signature verified."
          echo "V3 signature verified."

          # -----------------------------------------------------
          # PACKAGE
          # -----------------------------------------------------

          echo "========================================"
          echo "VERIFYING PACKAGE AND VERSION"
          echo "========================================"

          BADGING="$(
            "$BUILD_TOOLS/aapt" \
              dump badging \
              "$APK"
          )"

          echo "$BADGING"

          PACKAGE_LINE="$(
            echo "$BADGING" \
              | grep -F \
              "package: name='com.wEANUXX_20148007'"
          )"

          if [ -z "$PACKAGE_LINE" ]; then
            echo "ERROR: Incorrect package name."
            exit 1
          fi

          echo "$BADGING" \
            | grep -Fq "versionCode='3'"

          echo "$BADGING" \
            | grep -Fq "versionName='0.3.0-functional-update'"

          echo "Package verified."
          echo "Version Code 3 verified."
          echo "Version Name 0.3.0-functional-update verified."

          # -----------------------------------------------------
          # CERTIFICATE
          # -----------------------------------------------------

          echo "========================================"
          echo "VERIFYING APK CERTIFICATE"
          echo "========================================"

          EXPECTED_CERT="953F444B65594F10FCC456A7F5443FDB9554AF46F9A5FB72BF249291C848C7E0"

          # Normalize ALL certificate output so both colon-separated
          # and non-colon-separated fingerprints compare identically.
          NORMALIZED_CERT_OUTPUT="$(
            printf '%s' "$VERIFY_OUTPUT" \
              | tr -d ':\r\n\t ' \
              | tr '[:lower:]' '[:upper:]'
          )"

          if ! echo "$NORMALIZED_CERT_OUTPUT" \
            | grep -Fq "$EXPECTED_CERT"
          then
            echo "ERROR: Final APK certificate does not match EANUXX certificate."
            exit 1
          fi

          echo "Correct EANUXX APK certificate confirmed."

          # -----------------------------------------------------
          # ZIP INTEGRITY
          # -----------------------------------------------------

          echo "========================================"
          echo "VERIFYING APK ZIP INTEGRITY"
          echo "========================================"

          unzip -t "$APK" >/dev/null

          echo "APK ZIP integrity verified."

          # -----------------------------------------------------
          # FINAL resources.arsc CHECK
          # -----------------------------------------------------

          python3 - <<'PY'
          import sys
          import zipfile

          apk = "EANUXX-release.apk"

          try:
              with zipfile.ZipFile(apk, "r") as z:
                  info = z.getinfo("resources.arsc")

                  if info.compress_type != zipfile.ZIP_STORED:
                      print("ERROR: Final resources.arsc is compressed.")
                      sys.exit(1)

          except Exception as exc:
              print(f"ERROR: Final APK resource check failed: {exc}")
              sys.exit(1)

          print("Final resources.arsc check passed.")
          PY

          echo "========================================"
          echo "EANUXX UPDATE APK VERIFIED SUCCESSFULLY"
          echo "========================================"

          echo "Package: com.wEANUXX_20148007"
          echo "Version Code: 3"
          echo "Version Name: 0.3.0-functional-update"
          echo "V2 Signature: VERIFIED"
          echo "V3 Signature: VERIFIED"
          echo "Certificate: VERIFIED"
          echo "ZIP Integrity: VERIFIED"
          echo "resources.arsc: VERIFIED"
          echo "========================================"

      # =========================================================
      # 17. UPLOAD ONLY AFTER SUCCESSFUL VERIFICATION
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EANUXX-v0.3.0-update-APK
          path: EANUXX-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # =========================================================
      # 18. SECURE CLEANUP
      # =========================================================
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          set -eo pipefail

          echo "Removing signing material..."

          rm -f -- EANUXX-release.p12
          rm -f -- EANUXX-release-unsigned.apk
          rm -f -- EANUXX-release-aligned.apk

          echo "Signing material and temporary APKs removed."          set -euo pipefail

          rm -rf source
          mkdir -p source

          unzip -q "$SOURCE_ZIP" -d source

          echo "Source extracted successfully."

          find source -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print

      - name: Check Gradle project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(
            find "$GITHUB_WORKSPACE/source" \
              -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -print -quit \
              | xargs -r dirname
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project:"
          echo "$PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BUILDING EANUXX RELEASE APK"
          echo "========================================"

          gradle --no-daemon clean assembleRelease

          APK="$(
            find . \
              -type f \
              -path '*/build/outputs/apk/release/*.apk' \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not created."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/EANUXX-release-unsigned.apk"

          echo "Unsigned APK:"
          ls -lh "$GITHUB_WORKSPACE/EANUXX-release-unsigned.apk"

      - name: Locate Android build tools
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS_VERSION="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$BUILD_TOOLS_VERSION" ]; then
            echo "ERROR: Android Build Tools not found."
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"

          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

          echo "Android Build Tools: $BUILD_TOOLS_VERSION"
          echo "Android Build Tools located successfully."

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "ALIGNING APK"
          echo "========================================"

          "$BUILD_TOOLS/zipalign" \
            -f \
            -p \
            4 \
            EANUXX-release-unsigned.apk \
            EANUXX-release-aligned.apk

          test -s EANUXX-release-aligned.apk

          echo "APK alignment completed."

          "$BUILD_TOOLS/zipalign" \
            -c \
            -P 4 \
            4 \
            EANUXX-release-aligned.apk

          echo "APK alignment verification successful."

      - name: Verify resources.arsc
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import zipfile
          import sys

          apk = "EANUXX-release-aligned.apk"

          with zipfile.ZipFile(apk, "r") as z:
              info = z.getinfo("resources.arsc")

              if info.compress_type != zipfile.ZIP_STORED:
                  print("ERROR: resources.arsc is compressed.")
                  sys.exit(1)

              print("resources.arsc is uncompressed.")

          print("resources.arsc verification successful.")
          PY

      - name: Restore signing certificate
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.EANUXX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: EANUXX_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > EANUXX-release.p12

          chmod 600 EANUXX-release.p12

          test -s EANUXX-release.p12

          echo "Signing certificate restored."

      - name: Verify signing certificate
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: EANUXX_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          EXPECTED="953F444B65594F10FCC456A7F5443FDB9554AF46F9A5FB72BF249291C848C7E0"

          FINGERPRINT="$(
            keytool \
              -list \
              -v \
              -storetype PKCS12 \
              -keystore EANUXX-release.p12 \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias eanuxx \
              | awk -F': ' '/SHA256:/{print $2; exit}' \
              | tr -d ':' \
              | tr '[:lower:]' '[:upper:]'
          )"

          echo "Certificate fingerprint:"
          echo "$FINGERPRINT"

          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "ERROR: Wrong EANUXX certificate."
            exit 1
          fi

          echo "Correct EANUXX certificate confirmed."

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SIGNING EANUXX APK"
          echo "========================================"

          "$BUILD_TOOLS/apksigner" sign \
            --ks EANUXX-release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias eanuxx \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out EANUXX-release.apk \
            EANUXX-release-aligned.apk

          test -s EANUXX-release.apk

          echo "Signed APK created:"
          ls -lh EANUXX-release.apk

      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail

          APK="EANUXX-release.apk"

          echo "========================================"
          echo "VERIFYING FINAL EANUXX APK"
          echo "========================================"

          VERIFY_OUTPUT="$(
            "$BUILD_TOOLS/apksigner" verify \
              --verbose \
              --print-certs \
              "$APK" 2>&1
          )"

          echo "$VERIFY_OUTPUT"

          echo "$VERIFY_OUTPUT" \
            | grep -F \
            "Verified using v2 scheme (APK Signature Scheme v2): true"

          echo "$VERIFY_OUTPUT" \
            | grep -F \
            "Verified using v3 scheme (APK Signature Scheme v3): true"

          echo "V2 signature verified."
          echo "V3 signature verified."

          echo "========================================"
          echo "VERIFYING PACKAGE AND VERSION"
          echo "========================================"

          BADGING="$(
            "$BUILD_TOOLS/aapt" dump badging "$APK"
          )"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -F \
            "package: name='com.wEANUXX_20148007'"

          echo "$BADGING" \
            | grep -F \
            "versionCode='3'"

          echo "$BADGING" \
            | grep -F \
            "versionName='0.3.0-functional-update'"

          echo "Package verified."
          echo "Version verified."

          echo "========================================"
          echo "VERIFYING CERTIFICATE"
          echo "========================================"

          EXPECTED="953F444B65594F10FCC456A7F5443FDB9554AF46F9A5FB72BF249291C848C7E0"

          APK_CERT="$(
            echo "$VERIFY_OUTPUT" \
              | awk '/certificate SHA-256 digest:/{getline; print; exit}' \
              | tr -d '[:space:]' \
              | tr '[:lower:]' '[:upper:]' \
              | tr -d ':'
          )"

          echo "Expected:"
          echo "$EXPECTED"

          echo "APK:"
          echo "$APK_CERT"

          if [ "$APK_CERT" != "$EXPECTED" ]; then
            echo "ERROR: APK certificate does not match."
            exit 1
          fi

          echo "Correct EANUXX certificate confirmed."

          echo "========================================"
          echo "VERIFYING APK ZIP"
          echo "========================================"

          unzip -t "$APK"

          echo "APK ZIP integrity verified."

          echo "========================================"
          echo "EANUXX UPDATE APK VERIFIED SUCCESSFULLY"
          echo "========================================"

          echo "Package: com.wEANUXX_20148007"
          echo "Version Code: 3"
          echo "Version Name: 0.3.0-functional-update"
          echo "V2: VERIFIED"
          echo "V3: VERIFIED"
          echo "Certificate: VERIFIED"
          echo "ZIP: VERIFIED"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EANUXX-v0.3.0-update-APK
          path: EANUXX-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          rm -f EANUXX-release.p12

          echo "Signing material removed."          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

          echo "Source ZIP found:"
          echo "$ZIP"

      # ==========================================
      # EXTRACT SOURCE
      # ==========================================
      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          unzip -q "$SOURCE_ZIP" -d source

          echo "Source extracted successfully."

          find source -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print

      # ==========================================
      # FIND GRADLE PROJECT
      # ==========================================
      - name: Check Gradle project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(
            find "$GITHUB_WORKSPACE/source" \
              -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -print -quit \
              | xargs -r dirname
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project:"
          echo "$PROJECT_DIR"

          echo "Project contents:"
          ls -la "$PROJECT_DIR"

      # ==========================================
      # JAVA 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # GRADLE 8.9
      # ==========================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ==========================================
      # BUILD RELEASE APK
      # ==========================================
      - name: Build release APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING EANUXX RELEASE APK"
          echo "=========================================="

          gradle --no-daemon clean assembleRelease

          echo "Gradle build completed."

          APK="$(
            find . \
              -type f \
              -path '*/build/outputs/apk/release/*.apk' \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not created."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/EANUXX-release-unsigned.apk"

          echo "Unsigned APK created:"
          ls -lh "$GITHUB_WORKSPACE/EANUXX-release-unsigned.apk"

      # ==========================================
      # LOCATE ANDROID BUILD TOOLS
      # ==========================================
      - name: Locate Android build tools
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS_VERSION="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$BUILD_TOOLS_VERSION" ]; then
            echo "ERROR: Android build tools not found."
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

          echo "Using Android Build Tools:"
          echo "$BUILD_TOOLS_VERSION"

          echo "Checking zipalign..."
          "$BUILD_TOOLS/zipalign" -h >/dev/null

          echo "Checking apksigner..."
          "$BUILD_TOOLS/apksigner" --version

          echo "Android build tools located successfully."

      # ==========================================
      # ALIGN APK
      # ==========================================
      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ALIGNING APK"
          echo "=========================================="

          "$BUILD_TOOLS/zipalign" \
            -f \
            -p \
            4 \
            EANUXX-release-unsigned.apk \
            EANUXX-release-aligned.apk

          echo "APK alignment completed."

          "$BUILD_TOOLS/zipalign" \
            -c \
            -P 4 \
            4 \
            EANUXX-release-aligned.apk

          echo "zipalign verification successful."

      # ==========================================
      # VERIFY resources.arsc
      # ==========================================
      - name: Verify resources.arsc
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING resources.arsc"
          echo "=========================================="

          python3 - <<'PY'
          import zipfile
          import sys

          apk = "EANUXX-release-aligned.apk"

          with zipfile.ZipFile(apk, "r") as z:
              info = z.getinfo("resources.arsc")

              if info.compress_type != zipfile.ZIP_STORED:
                  print("ERROR: resources.arsc is compressed.")
                  sys.exit(1)

              print("resources.arsc is uncompressed.")
          PY

          echo "resources.arsc verification successful."

      # ==========================================
      # RESTORE SIGNING CERTIFICATE
      # ==========================================
      - name: Restore signing certificate
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.EANUXX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "RESTORING EANUXX SIGNING CERTIFICATE"
          echo "=========================================="

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: EANUXX_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" \
            | base64 --decode \
            > EANUXX-release.p12

          chmod 600 EANUXX-release.p12

          echo "Signing certificate restored."

      # ==========================================
      # VERIFY SIGNING CERTIFICATE
      # ==========================================
      - name: Verify signing certificate
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING SIGNING CERTIFICATE"
          echo "=========================================="

          keytool \
            -list \
            -v \
            -keystore EANUXX-release.p12 \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias eanuxx

          echo "Signing certificate verified."

      # ==========================================
      # SIGN APK
      # ==========================================
      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EANUXX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SIGNING EANUXX APK"
          echo "=========================================="

          "$BUILD_TOOLS/apksigner" sign \
            --ks EANUXX-release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias eanuxx \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out EANUXX-release.apk \
            EANUXX-release-aligned.apk

          echo "APK signing completed."

          ls -lh EANUXX-release.apk

      # ==========================================
      # VERIFY FINAL APK
      # ==========================================
      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail

          APK="EANUXX-release.apk"

          echo "=========================================="
          echo "VERIFYING FINAL EANUXX APK"
          echo "=========================================="

          # --------------------------------------
          # APK SIGNATURE
          # --------------------------------------

          VERIFY_OUTPUT="$(
            "$BUILD_TOOLS/apksigner" verify \
              --verbose \
              --print-certs \
              "$APK" 2>&1
          )"

          echo "$VERIFY_OUTPUT"

          echo "$VERIFY_OUTPUT" \
            | grep -F \
            "Verified using v2 scheme (APK Signature Scheme v2): true"

          echo "$VERIFY_OUTPUT" \
            | grep -F \
            "Verified using v3 scheme (APK Signature Scheme v3): true"

          echo "V2 signature confirmed."
          echo "V3 signature confirmed."

          # --------------------------------------
          # ANDROID PACKAGE / VERSION
          # --------------------------------------

          echo "=========================================="
          echo "VERIFYING PACKAGE AND VERSION"
          echo "=========================================="

          BADGING="$(
            "$BUILD_TOOLS/aapt" dump badging "$APK"
          )"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -F \
            "package: name='com.wEANUXX_20148007'"

          echo "$BADGING" \
            | grep -F \
            "versionCode='3'"

          echo "$BADGING" \
            | grep -F \
            "versionName='0.3.0-functional-update'"

          echo "Package confirmed:"
          echo "com.wEANUXX_20148007"

          echo "Version Code confirmed:"
          echo "3"

          echo "Version Name confirmed:"
          echo "0.3.0-functional-update"

          # --------------------------------------
          # CERTIFICATE
          # --------------------------------------

          echo "=========================================="
          echo "VERIFYING EANUXX CERTIFICATE"
          echo "=========================================="

          EXPECTED_CERT="953F444B65594F10FCC456A7F5443FDB9554AF46F9A5FB72BF249291C848C7E0"

          NORMALIZED_OUTPUT="$(
            echo "$VERIFY_OUTPUT" \
              | tr '[:lower:]' '[:upper:]' \
              | tr -d ':'
          )"

          echo "Expected certificate fingerprint:"
          echo "$EXPECTED_CERT"

          echo "Checking final APK certificate..."

          echo "$NORMALIZED_OUTPUT" \
            | grep -F "$EXPECTED_CERT"

          echo "Correct EANUXX certificate confirmed."

          # --------------------------------------
          # ZIP INTEGRITY
          # --------------------------------------

          echo "=========================================="
          echo "VERIFYING APK ZIP INTEGRITY"
          echo "=========================================="

          unzip -t "$APK"

          echo "ZIP integrity confirmed."

          # --------------------------------------
          # FINAL SUCCESS
          # --------------------------------------

          echo "=========================================="
          echo "EANUXX APK VERIFICATION SUCCESSFUL"
          echo "=========================================="

          echo "Package: com.wEANUXX_20148007"
          echo "Version Code: 3"
          echo "Version Name: 0.3.0-functional-update"
          echo "V2 Signature: VERIFIED"
          echo "V3 Signature: VERIFIED"
          echo "Certificate: VERIFIED"
          echo "ZIP Integrity: VERIFIED"

          echo "=========================================="
          echo "READY FOR APK DOWNLOAD"
          echo "=========================================="

      # ==========================================
      # UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EANUXX-v0.3.0-update-APK
          path: EANUXX-release.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # REMOVE SIGNING MATERIAL
      # ==========================================
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          rm -f EANUXX-release.p12

          echo "Signing material removed."
